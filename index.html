{title:"Oceanosaurus", year:2006, type:"DVD", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/82/72/59/19633721.jpg", youtube:"https://youtu.be/dZ3jrXPaCeo?is=hJL-HnURqDt3nD3e", resume:"Documentaire IMAX qui plonge le spectateur il y a 82 millions d’années pour suivre une famille de Dolichorhynchops et découvrir les reptiles marins géants du Crétacé.", actors:"Documentaire"},
{title:"Opération Corned-Beef", year:1991, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/74/29/80/19252078.jpg", youtube:"https://youtu.be/fhV6BKjuHmg?is=RO7USF3qJmafgprn", resume:"Pour Squale, agent secret, as de la DGSE, il s'agit de démanteler un réseau international de trafic d'armes et de démasquer un traître au plus haut niveau de l'État français. Pour arriver à ses fins il va manipuler un honnête citoyen, Jean-Jacques Granianski, psychologue d'entreprise, Français moyen type qui va résister au super-agent secret de façon inattendue.", actors:"Christian Clavier, Jean Reno, Valérie Lemercier"},
{title:"Pacific Rim", year:2013, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/210/081/21008109_20130524124818714.jpg", youtube:"https://youtu.be/qOX_O118N7k?is=BQ1lzfSL3WlrJtzy", resume:"Surgies des mers, des créatures monstrueuses, les Kaiju, ravagent l’humanité. Pour les combattre, les hommes créent les Jaegers : des robots géants pilotés par deux humains connectés. Mais même les Jaegers semblent impuissants face aux Kaiju.", actors:"Charlie Hunnam, Idris Elba, Rinko Kikuchi"},
{title:"Passengers", year:2016, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/16/12/14/16/45/405336.jpg", youtube:"https://www.youtube.com/watch?v=ggigUv7yQ0A", resume:"À bord de l'Avalon, vaisseau transportant 5000 passagers endormis vers une nouvelle planète, Jim et Aurora sont accidentellement réveillés 90 ans trop tôt. Contraints d'accepter de passer le reste de leur vie ensemble sur le vaisseau, ils tombent amoureux avant de découvrir que l'Avalon court un grave danger.", actors:"Jennifer Lawrence, Chris Pratt, Michael Sheen, Laurence Fishburne"},
{title:"Payback", year:1999, type:"DVD", act:"action", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/94/41/53/20537977.jpg", youtube:"https://youtu.be/Ue7f2wTm8OI?is=J1lzdCvLhbBfnzir", resume:"Trahi par sa femme et son partenaire lors d’un braquage, Porter survit et n’a qu’une idée en tête : récupérer sa part des 70 000 dollars. Mais son ex-associé travaille maintenant pour la Mafia.", actors:"Mel Gibson, Gregg Henry, Maria Bello"},
{title:"Percy Jackson : Le Voleur de foudre", year:2010, type:"DVD", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/71/92/68/19225578.jpg", youtube:"https://youtu.be/n5eVOZ6aGkM?is=FDReQn8N8ka5LSA9", resume:"Percy Jackson, ado dyslexique, découvre qu’il est le fils de Poséidon. Accusé par Zeus d’avoir volé son éclair, il doit le retrouver pour empêcher une guerre entre les dieux de l’Olympe.", actors:"Logan Lerman, Brandon T. Jackson, Alexandra Daddario"},
{title:"Percy Jackson : La Mer des monstres", year:2013, type:"DVD", cat:"fiction", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/210/163/21016312_20130627172719133.jpg", youtube:"https://youtu.be/kfYsRaABFHw?is=Ykon7tIX61ZT9Xeg", resume:"L’arbre de Thalia, qui protège la Colonie des Sang-Mêlé, est empoisonné. Percy et ses amis partent en mer pour retrouver la Toison d’Or, seul remède capable de sauver leur refuge.", actors:"Logan Lerman, Alexandra Daddario, Douglas Smith"},

{title:"S.O.S. Fantômes Filles ", year:2016, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/16/06/17/10/13/235607.jpg", youtube:"https://youtu.be/gmeVnCwrc9c?is=uc7Aar8mvpe-P3CQ", resume:"Abby et Erin, deux physiciennes, s’associent à une ingénieure et une employée du métro pour former une nouvelle équipe de chasseuses de fantômes à New York envahie par les spectres.", actors:"Melissa McCarthy, Kristen Wiig, Kate McKinnon"},
{title:"Spartacus", year:1960, type:"DVD", cat:"peplum", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/64/34/30/19076686.jpg", youtube:"https://youtu.be/HcIMY1Ah3aw?is=IDr5l9b2VwUs7a4Y", resume:"Esclave thrace acheté pour une école de gladiateurs, Spartacus mène la plus grande révolte d’esclaves contre la République romaine. Son armée défie les légions de Crassus.", actors:"Kirk Douglas, Laurence Olivier, Jean Simmons"},
{title:"Spider-Man", year:2002, type:"DVD", cat:"sf", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/00/00/00/33/spiderman.jpg", youtube:"https://youtu.be/ea6iiJs9BeI?is=clJINUDSuHIbPC0K", resume:"Peter Parker, lycéen timide, est mordu par une araignée génétiquement modifiée. Il acquiert des super-pouvoirs et devient Spider-Man pour combattre le Bouffon Vert à New York.", actors:"Tobey Maguire, Kirsten Dunst, Willem Dafoe"},
{title:"Spider-Man 2", year:2004, type:"DVD", cat:"sf", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/35/16/02/18380826.jpg", youtube:"https://youtu.be/4ZIekwOMhdU?is=Q2xS19e2DseDfsfg", resume:"Deux ans plus tard, Peter Parker a du mal à concilier sa vie normale et son devoir de Spider-Man. Il affronte le Dr Octopus, scientifique dont l’expérience a mal tourné.", actors:"Tobey Maguire, Kirsten Dunst, Alfred Molina"},
{title:"Spider-Man 3", year:2007, type:"DVD", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/62/65/18754165.jpg", youtube:"https://youtu.be/qK7nMGNlHgk?is=_g-IHDy-bRSTQF1p", resume:"Peter Parker a enfin réussi à concilier son amour pour Mary-Jane et ses devoirs de super-héros. Mais l’horizon s’obscurcit : son costume devient noir après avoir été infecté par un symbiote, décuplant son agressivité. Il doit affronter l’Homme-Sable et son ancien ami Harry devenu le Nouveau Bouffon.", actors:"Tobey Maguire, Kirsten Dunst, Topher Grace"},
{title:"The Amazing Spider-Man", year:2012, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/83/19/35/20158079.jpg", youtube:"https://youtu.be/kVKwsqTaVyQ?is=Pwyui5_MH6Zn6eSg", resume:"Peter Parker, lycéen abandonné par ses parents, est élevé par son oncle et sa tante. En enquêtant sur la disparition de ses parents, il est mordu par une araignée génétiquement modifiée. Il devient Spider-Man et affronte le Lézard.", actors:"Andrew Garfield, Emma Stone, Rhys Ifans"},
{title:"The Amazing Spider-Man - le destin d un hero", year:2014, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/14/01/08/18/54/426954.jpg", youtube:"https://youtu.be/5DIzJOKh_kY?is=j1A6fkmtWtC1l67M", resume:"Ce n’est un secret pour personne que le combat le plus rude de Spider-Man est celui qu’il mène contre lui-même en tentant de concilier la vie quotidienne de Peter Parker et les lourdes responsabilités de Spider-Man. Mais Peter Parker va se rendre compte qu’il fait face à un conflit de bien plus grande ampleur. Être Spider-Man, quoi de plus grisant ? Peter Parker trouve son bonheur entre sa vie de héros, bondissant d’un gratte-ciel à l’autre, et les doux moments passés aux côté de Gwen. Mais être Spider-Man a un prix : il est le seul à pouvoir protéger ses concitoyens new-yorkais des abominables méchants qui menacent la ville. Face à Electro, Peter devra affronter un ennemi nettement plus puissant que lui. Au retour de son vieil ami Harry Osborn, il se rend compte que tous ses ennemis ont un point commun : OsCorp.", actors:"Andrew Garfield, Emma Stone, Rhys Ifans"},
{title:"SPIDER-MAN - Homecoming", year:2017, type:"Blu-ray", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/17/05/30/13/13/145510.jpg", youtube:"https://youtu.be/BmbfD7F3BoQ?is=W_Nu5UVU0JIOIRAL", resume:"Après ses spectaculaires débuts dans Captain America : Civil War, le jeune Peter Parker découvre peu à peu sa nouvelle identité, celle de Spider-Man, le super-héros lanceur de toile. Galvanisé par son expérience avec les Avengers, Peter rentre chez lui auprès de sa tante May, sous l’œil attentif de son nouveau mentor, Tony Stark. Il s’efforce de reprendre sa vie d’avant, mais au fond de lui, Peter rêve de se prouver qu’il est plus que le sympathique super héros du quartier. L’apparition d’un nouvel ennemi, le Vautour, va mettre en danger tout ce qui compte pour lui...", actors:"Tom HOLLAND, Michael KEATON, Robert DOWNEY Jr"},
{title:"SPIDER-MAN - Far From Home", year:2019, type:"Blu-ray", cat:"sf", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/19/06/13/15/28/4575985.jpg", youtube:"https://youtu.be/inFIHmGshgk?is=jPBsJxzN4gWACc9l", resume:"L'araignée sympa du quartier décide de rejoindre ses meilleurs amis Ned, MJ, et le reste de la bande pour des vacances en Europe. Cependant, le projet de Peter de laisser son costume de super-héros derrière lui pendant quelques semaines est rapidement compromis quand il accepte à contrecoeur d'aider Nick Fury à découvrir le mystère de plusieurs attaques de créatures, qui ravagent le continent !", actors:"Tom HOLLAND, Jake GYLLENHAAL, Samuel L JACKSON"},
{title:"Sweeney Todd : Le Diabolique Barbier de Fleet Street", year:2007, type:"Blu-ray", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/64/03/84/18876989.jpg", youtube:"https://youtu.be/wikVFUJ2vNw?is=kqlgqgYinAZIQf5P", resume:"De retour à Londres après des années de bagne, Benjamin Barker, sous le nom de Sweeney Todd, ouvre une échoppe de barbier. Avec Mrs Lovett, il prépare une vengeance sanglante contre le juge Turpin qui l’a exilé.", actors:"Johnny Depp, Helena Bonham Carter, Alan Rickman"},
{title:"Source Code", year:2011, type:"Blu-ray", cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/81/94/80/19693276.jpg", youtube:"https://youtu.be/wYecrTp_aUE?is=tZGYajv-UMaX1oyA", resume:"Le capitaine Colter Stevens se réveille dans le corps d'un inconnu, revivant en boucle les huit dernières minutes avant l'explosion d'un train. Grâce au programme Source Code, il doit identifier le poseur de bombe pour empêcher un attentat encore plus grave à venir.", actors:"Jake Gyllenhaal, Michelle Monaghan, Vera Farmiga, Jeffrey Wright"},
{title:"Tempête de boulettes géantes ", year:2009, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/68/38/96/19133443.jpg", youtube:"https://youtu.be/8CtlT4QTvig?feature=shared", resume:"Alors que Swallow Falls connaît une période de vache maigre, ses habitants ont seulement les moyens de manger des sardines. Flint Lockwood, un inventeur raté, pense qu'il a la réponse à cette situation difficile. Il construit une machine qui change l'eau en nourriture et devient un héros local quand il pleut des friandises succulentes. La machine devient incontrôlable et menace d'enterrer le monde entier sous des monticules de nourriture.", actors:"Voix VF : Bill Hader, Anna Faris (VO)"},
{title:"Tempête de boulettes géantes 2", year:2013, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/14/01/02/12/28/524174.jpg", youtube:"https://youtu.be/C4MKKPAJ4dE?is=Cuzqz8mrgzlJvQUw", resume:"Flint Lockwood est recruté par son idole pour nettoyer son île, envahie par des Bio-aliments mi-vivants mi-nourriture issus de sa machine à cloner la nourriture. Il découvre un écosystème délirant peuplé de créatures aussi comestibles que dangereuses.", actors:"Voix VF : Bill Hader, Anna Faris (VO)"},
{title:"Teen Wolf", year:1985, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/71/37/11/19132753.jpg", youtube:"https://youtu.be/SU_NP9qCynM?is=QNSrE-k5Zl8i3IFl", resume:"Scott Howard, lycéen maladroit, découvre qu’il est un loup-garou. Ses nouveaux pouvoirs font de lui la star du lycée et de l’équipe de basket, mais il risque de perdre son humanité.", actors:"Michael J. Fox, James Hampton, Susan Ursitti"},
{title:"Terminator Genisys", year:2015, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/15/06/29/10/53/495349.jpg", youtube:"https://youtu.be/TYytGTAjSlI?is=YXPPl8BWvd_Tt1_l", resume:"En 2029, John Connor envoie Kyle Reese en 1984 pour protéger sa mère Sarah. Mais la ligne temporelle a changé : Sarah est déjà une guerrière élevée par un Terminator reprogrammé. Ensemble, ils doivent affronter un T-3000.", actors:"Arnold Schwarzenegger, Emilia Clarke, Jai Courtney"},
{title:"The Day the Earth Stood Still", year:2008, type:"DVD", cat:"fiction", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/66/87/07/19008867.jpg", youtube:"https://youtu.be/GkTwnkAVdYA?is=ptCpO6pKhszmBtJs", resume:"Une soucoupe volante atterrit à Central Park. En sort Klaatu, un extraterrestre humanoïde venu délivrer un message à l’humanité : cessez vos violences ou la Terre sera détruite pour préserver les autres planètes.", actors:"Keanu Reeves, Jennifer Connelly, Jaden Smith"},
{title:"The Moon", year:2023, type:"Blu-ray", cat:"sf", img:"https://fr.web.img4.acsta.net/c_310_420/img/3f/4f/3f4f576723f40e9246fa4b93d9ef2484.jpg", youtube:"https://youtu.be/pNYAJJv8qxA?is=EImA1X0hoZMaECbT", resume:"Lors d’une mission lunaire coréenne, un accident laisse l’astronaute Hwang Sun-woo seul sur la Lune. Depuis la Terre, l’ancien directeur du centre spatial tente l’impossible pour le ramener.", actors:"Do Kyung-soo, Sol Kyung-gu, Kim Hee-ae"},
{title:"The Revenant", year:2015, type:"DVD", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/15/11/10/09/30/165611.jpg", youtube:"https://youtu.be/S2MKo4pOphM?is=pE-HqxhSmvjg7gvT", resume:"Dans les années 1820, le trappeur Hugh Glass est attaqué par un ours et laissé pour mort par son équipe. Survivant, il entreprend un périple de 300 km dans l’hiver hostile pour se venger de John Fitzgerald qui l’a abandonné.", actors:"Leonardo DiCaprio, Tom Hardy, Domhnall Gleeson"},
{title:"Titanic", year:1997, type:"Blu-ray 3D", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/23/01/10/16/06/0622119.jpg", youtube:"https://youtu.be/Quf4qIkD3KY?is=Gd9xvjYnQI4jCsBT", resume:"Southampton, 1912. Rose, jeune passagère de première classe, et Jack, artiste sans le sou en troisième classe, tombent amoureux à bord du Titanic. Mais le paquebot réputé insubmersible heurte un iceberg.", actors:"Leonardo DiCaprio, Kate Winslet, Billy Zane"},
{title:"Troie", year:2004, type:"Blu-ray", cat:"peplum", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/35/23/55/18379045.jpg", youtube:"https://youtu.be/IeZrKyyXYjY?is=ND_Y_3BhAGw7Jb8z", resume:"En 1193 av. J.-C., Pâris, prince de Troie, enlève Hélène, reine de Sparte. Pour laver cet affront, le roi Agamemnon lance les Grecs dans une guerre de dix ans contre la cité fortifiée défendue par Hector et Achille.", actors:"Brad Pitt, Eric Bana, Orlando Bloom"},
{title:"Transcendance", year:2014, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/14/05/05/15/38/543364.jpg", youtube:"https://youtu.be/HXNdqJF_igo?is=phDIHOnP6ql_v4FA", resume:"Will Caster, chercheur en intelligence artificielle mortellement blessé, accepte que sa conscience soit numérisée et transférée dans un ordinateur quantique. Sa version numérique acquiert des pouvoirs illimités, inquiétant peu à peu ses proches et le gouvernement.", actors:"Johnny Depp, Rebecca Hall, Paul Bettany, Morgan Freeman"},
{title:"Twilight, chapitre 1 : Fascination", year:2008, type:"DVD", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/67/60/06/19031254.jpg", youtube:"https://youtu.be/xzO_Iiwt4b4?is=uBtLT2d7nLBACiWQ", resume:"Bella Swan emménage à Forks et tombe amoureuse d'Edward Cullen, un lycéen mystérieux qui se révèle être un vampire vieux de plus d'un siècle. Leur amour interdit est menacé par un vampire nomade assoiffé du sang de Bella.", actors:"Kristen Stewart, Robert Pattinson, Taylor Lautner"},
{title:"Twilight, chapitre 2 : Tentation", year:2009, type:"DVD", cat:"fiction", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/69/39/18/19193626.jpg", youtube:"https://youtu.be/ShHNEvFPtvc?is=0Dxq9ik2MDPGIlMj", resume:"Pour la protéger, Edward quitte Bella, la laissant profondément meurtrie. Elle se rapproche alors de Jacob Black, son ami d'enfance, qui cache lui aussi un lourd secret : il appartient à une tribu de loups-garous ennemis jurés des vampires.", actors:"Kristen Stewart, Robert Pattinson, Taylor Lautner"},
{title:"Twilight, chapitre 3 : Hésitation", year:2010, type:"DVD", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/73/05/75/19415045.jpg", youtube:"https://youtu.be/yi4xJGebtuk?is=cGW-2uY4ktg2S46B", resume:"Une armée de nouveaux-nés vampires menace Forks, créée par Victoria pour se venger d'Edward. Bella, tiraillée entre son amour pour Edward et son attachement à Jacob, doit choisir son camp alors que la guerre entre vampires et loups-garous éclate.", actors:"Kristen Stewart, Robert Pattinson, Taylor Lautner"},
{title:"Twilight, chapitre 4 : Révélation, 1re partie", year:2011, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/82/81/17/19824067.jpg", youtube:"https://youtu.be/_jWriOZlsnw?is=O2kW2Kze8g0Swg-i", resume:"Bella et Edward se marient enfin. Lors de leur lune de miel, Bella tombe enceinte d'un enfant mi-humain mi-vampire dont la grossesse menace sa vie, provoquant une rupture avec la meute de loups-garous qui veut détruire l'enfant à naître.", actors:"Kristen Stewart, Robert Pattinson, Taylor Lautner"},
{title:"Twilight, chapitre 5 : Révélation, 2e partie", year:2012, type:"DVD", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/89/43/69/20278941.jpg", youtube:"https://youtu.be/CjdPAg-gyFE?is=DB1FHk0CISdrOtUu", resume:"Devenue vampire pour survivre à l'accouchement, Bella découvre ses nouveaux pouvoirs aux côtés d'Edward et de leur fille Renesmée. Mais les Volturi, persuadés que l'enfant est un danger, rassemblent une armée pour l'éliminer.", actors:"Kristen Stewart, Robert Pattinson, Taylor Lautner, Michael Sheen"},
{title:"Un duplex pour 3", year:2004, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/29/34/18381064.jpg", youtube:"https://youtu.be/mdMv1fQ0yU4?is=Qk4_CzMGeAZJf9zD", resume:"Alex et Nancy trouvent le duplex de leurs rêves à Brooklyn. Seul bémol : l’étage est occupé par une vieille dame apparemment inoffensive. Mais la charmante locataire va se révéler un véritable cauchemar.", actors:"Ben Stiller, Drew Barrymore, Eileen Essell"},
{title:"Valérian et la Cité des mille planètes", year:2017, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/17/05/24/09/19/550722.jpg", youtube:"https://youtu.be/dMSwqPetdVs?is=GAzt3SU6lREmgWoc", resume:"Au 28e siècle, Valérian et Laureline, agents spatio-temporels, sont chargés de maintenir l’ordre dans les territoires humains. Ils sont envoyés en mission sur Alpha, métropole intergalactique de 17 millions d’habitants.", actors:"Dane DeHaan, Cara Delevingne, Clive Owen"},
{title:"Van Helsing", year:2004, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/19/42/18377156.jpg", youtube:"https://youtu.be/FlL00GqKBu8?is=ZdAno1QARJXSV00a", resume:"Le célèbre chasseur de monstres Gabriel Van Helsing est envoyé en Transylvanie par le Vatican. Il doit aider Anna Valerious à vaincre le comte Dracula qui utilise les recherches du Dr Frankenstein.", actors:"Hugh Jackman, Kate Beckinsale, Richard Roxburgh"},
{title:"Vice-Versa", year:2015, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/15/04/16/13/58/571071.jpg", youtube:"https://youtu.be/J4_8jijwNs0?is=h9uiuyYgxs_haGFB", resume:"Riley, 11 ans, déménage à San Francisco. Ses émotions – Joie, Tristesse, Colère, Dégoût et Peur – tentent de la guider. Mais Joie et Tristesse se perdent dans sa mémoire, laissant le chaos s’installer.", actors:"Amy Poehler, Phyllis Smith, Bill Hader"},
{title:"Vercingétorix", year:2001, type:"DVD", cat:"peplum", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/images/affiches/051231.jpg", youtube:"https://youtu.be/cGmfpNLqpqo?is=3DvaSsnmw4qXE_ee", resume:"En 52 avant J.-C., le jeune chef arverne Vercingétorix parvient à unifier les tribus gauloises pour résister à l'invasion romaine menée par Jules César. Son destin le mènera de la victoire de Gergovie jusqu'au siège d'Alésia.", actors:"Christophe Lambert, Max von Sydow, Klaus Maria Brandauer"},
{title:"Very Bad Trip", year:2009, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/70/03/08/19109117.jpg", youtube:"https://youtu.be/hHqR9Tq16_E?is=oWY3XNn0fDE_1phW", resume:"Pour l’enterrement de vie de garçon de Doug, trois amis l’emmènent à Las Vegas. Le lendemain, ils se réveillent sans aucun souvenir de la nuit passée. La suite est manquante, le marié aussi.", actors:"Bradley Cooper, Ed Helms, Zach Galifianakis"},
{title:"Very Bad Trip 2", year:2011, type:"DVD", cat:"comedie", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/82/09/89/19715770.jpg", youtube:"https://youtu.be/DFw9AlqUbYQ?is=WAPsQmib_jqX4zeY", resume:"Pour l'enterrement de vie de garçon de Stu cette fois, la bande se retrouve à Bangkok. Après une nuit de folie dont ils ne se souviennent de rien, ils doivent retrouver le petit frère de la mariée, disparu, avant la cérémonie.", actors:"Bradley Cooper, Ed Helms, Zach Galifianakis, Justin Bartha"},
{title:"Very Bad Trip 3", year:2013, type:"DVD", cat:"comedie", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/210/080/21008070_20130524113929346.jpg", youtube:"https://youtu.be/ibq2kS7NRaU?is=REORjy6ke0WVD94M", resume:"Cette fois, pas de mariage ni d'enterrement de vie de garçon : la bande doit escorter Alan, devenu incontrôlable, jusqu'à une cure de désintoxication. Le voyage tourne mal quand un gangster kidnappe l'un des leurs pour retrouver un escroc qui leur a volé de l'or.", actors:"Bradley Cooper, Ed Helms, Zach Galifianakis, Justin Bartha, John Goodman"},
{title:"Volcano", year:1997, type:"DVD", cat:"sf", img:"https://fr.web.img2.acsta.net/c_310_420/medias/02/88/74/028874_af.jpg", youtube:"https://youtu.be/jB1sYnbJGq0?is=nBt9rbVFLxvH09sF", resume:"Un volcan entre soudainement en éruption sous les rues de Los Angeles. Mike Roark, responsable de la gestion des crises de la ville, doit organiser l'évacuation et stopper la coulée de lave qui menace d'engloutir toute la métropole.", actors:"Tommy Lee Jones, Anne Heche, Gaby Hoffmann"},
{title:"Voyage au centre de la Terre 2 : L’Île mystérieuse", year:2012, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/86/56/12/19957676.jpg", youtube:"https://youtu.be/EnbONyFzAZs?is=y4XssHuDqCFu6Hsk", resume:"Sean Anderson reçoit un signal de détresse codé venant d’une île mystérieuse. Avec son beau-père, il part pour le Pacifique et découvre un monde peuplé de créatures incroyables et de volcans.", actors:"Dwayne Johnson, Josh Hutcherson, Michael Caine"},
{title:"Voyage au centre de la Terre 3D", year:2008, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/65/76/91/18947727.jpg", youtube:"https://youtu.be/ip-D1fT0PQw?is=c4RhRIChOUo5oUiV", resume:"Lors d’une expédition en Islande, le scientifique Trevor Anderson, son neveu Sean et leur guide Hannah sont piégés dans une grotte. Ils découvrent un monde perdu au centre de la Terre.", actors:"Brendan Fraser, Josh Hutcherson, Anita Briem"},
{title:"World War Z", year:2013, type:"Blu-ray 3D", cat:"action", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/94/54/41/20526204.jpg", youtube:"https://youtu.be/a2-KBFmjxMw?is=08SghOHiQaT_0q7B", resume:"Gerry Lane, ancien enquêteur de l’ONU, parcourt le monde dans une course contre la montre pour stopper une pandémie qui transforme les humains en zombies et menace l’humanité.", actors:"Brad Pitt, Mireille Enos, Daniella Kertesz"},

/* =========================
   INIT
========================= */
let films = [...FILMS_DEFAUT];
let currentFilmIndex = null;

/* =========================
   COMPTEUR FILMS/SERIES
========================= */
function updateCompteur(filtreCat = "", filtreType = "", filtreDec = ""){
  const nbTotalFilms = films.filter(f => {
    const filmCats = Array.isArray(f.cat)? f.cat : [f.cat];
    return!filmCats.some(c => c?.toLowerCase() === "série" || c?.toLowerCase() === "série tv" || c?.toLowerCase() === "series");
  }).length;
  const nbSeries = films.length - nbTotalFilms;

  if(filtreCat){
    const nbDansCat = films.filter(f => f.cat === filtreCat).length;
    const estSerie = filtreCat.toLowerCase() === "série" || filtreCat.toLowerCase() === "série tv" || filtreCat.toLowerCase() === "series";
    const label = estSerie? "séries" : "films";
    document.getElementById("compteur").innerText = `${filtreCat} : ${nbDansCat} ${label}`;
  }
  else if(filtreType){
    const nbDansType = films.filter(f => f.type === filtreType).length;
    document.getElementById("compteur").innerText = `${filtreType} : ${nbDansType} films`;
  }
  else if(filtreDec){
    const nbDansDec = films.filter(f => Math.floor(f.year / 10) * 10 == filtreDec).length;
    document.getElementById("compteur").innerText = `${filtreDec}-${parseInt(filtreDec)+9} : ${nbDansDec} films`;
  }
  else {
    document.getElementById("compteur").innerText = nbSeries > 0? `${nbTotalFilms} films • ${nbSeries} séries` : `${nbTotalFilms} films`;
  }
  // MODIF 1 : compteur sur le bouton
  const btnA = document.getElementById("btnAcheter");
  if(btnA) btnA.innerText = `🛒 À acheter (${FILMS_A_ACHETER.length})`;
}

/* =========================
   GÉNÉRATION AUTO DES FILTRES
========================= */
function initFiltres(){
  const cats = [...new Set(films.map(f => f.cat).filter(Boolean))].sort();
  const selectCat = document.getElementById("filterCat");
  selectCat.innerHTML = '<option value="">Catégories</option>';
  cats.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.innerText = cat;
    selectCat.appendChild(opt);
  });

  const annees = films.map(f => f.year).filter(Boolean);
  if(annees.length > 0){
    const minDec = Math.floor(Math.min(...annees) / 10) * 10;
    const maxDec = Math.floor(Math.max(...annees) / 10) * 10;
    const selectDec = document.getElementById("filterDecennie");
    selectDec.innerHTML = '<option value="">Décennies</option>';
    for(let d = maxDec; d >= minDec; d -= 10){
      const opt = document.createElement("option");
      opt.value = d;
      opt.innerText = `${d}-${d+9}`;
      selectDec.appendChild(opt);
    }
  }

  updateCompteur();
}

/* =========================
   AFFICHAGE GRILLE
========================= */
function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let data = films;
  const typeFilter = document.getElementById("filterType").value;
  const catFilter = document.getElementById("filterCat").value;
  const decFilter = document.getElementById("filterDecennie").value;
  const searchQuery = document.getElementById("search").value.toLowerCase();

  if(typeFilter) data = data.filter(f => f.type === typeFilter);
  if(catFilter) data = data.filter(f => f.cat === catFilter);
  if(decFilter) data = data.filter(f => Math.floor(f.year / 10) * 10 == decFilter);
  if(searchQuery) data = data.filter(f => f.title.toLowerCase().includes(searchQuery));

  updateCompteur(catFilter, typeFilter, decFilter);

  if(data.length === 0){
    grid.innerHTML = '<p style="padding:20px">Aucun film. Ajoute tes films dans FILMS_DEFAUT dans le code.</p>';
    return;
  }

  data.forEach((f, i) => {
    const realIndex = films.indexOf(f);
    const div = document.createElement("div");
    div.className = "card";
    div.onclick = () => openFilm(realIndex);
    div.innerHTML = `
      <img src="${f.img || 'https://via.placeholder.com/300x450/222/fff?text=Pas+d%27image'}" alt="${f.title}">
      <div class="info">
        <div class="title">${f.title}</div>
        <div class="small">${f.year} - ${f.type}</div>
        <div class="small">${f.cat || "Sans catégorie"}</div>
      </div>
    `;
    grid.appendChild(div);
  });
}

/* =========================
   FICHE FILM
========================= */
function openFilm(i){
  currentFilmIndex = i;
  const f = films[i];
  document.getElementById("fPoster").src = f.img || 'https://via.placeholder.com/300x450/222/fff?text=Pas+d%27image';
  document.getElementById("fTitle").innerText = f.title;
  document.getElementById("fYear").innerText = `(${f.year})`;
  document.getElementById("fType").innerText = f.type;
  document.getElementById("fCat").innerText = f.cat || "Sans catégorie";
  document.getElementById("fDate").innerText = f.year;
  document.getElementById("fResume").innerText = f.resume || "Pas de synopsis disponible.";
  document.getElementById("fActors").innerText = f.actors || "Acteurs non renseignés.";

  const btnVoirFilm = document.getElementById("btnVoirFilm");
  if(f.lienVideo && f.lienVideo.trim()!== ""){
    btnVoirFilm.style.display = "flex";
  } else {
    btnVoirFilm.style.display = "none";
  }

  document.getElementById("popupFilm").style.display="block";
  document.body.style.overflow = "hidden";
}

function closeFilm(){
  document.getElementById("popupFilm").style.display="none";
  document.body.style.overflow = "auto";
}

function openTrailer(){
  const f = films[currentFilmIndex];
  if(f.youtube){
    window.open(f.youtube,'_blank');
  } else {
    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(f.title+" "+f.year+" bande annonce VF")}`,'_blank');
  }
}

function voirFilm(){
  const f = films[currentFilmIndex];
  if(f.lienVideo){
    window.open(f.lienVideo, '_blank');
  }
}

function closeVideo(){
  document.getElementById("popupVideo").style.display = "none";
  document.getElementById("videoFrame").src = "";
  document.body.style.overflow = "auto";
}

/* =========================
   A ACHETER - NOUVELLE VERSION
========================= */
function renderAcheter(filterText = ""){
  const grid = document.getElementById("gridAcheter");
  grid.innerHTML = "";
  let data = [...FILMS_A_ACHETER].sort((a,b) => a.title.localeCompare(b.title));
  if(filterText){
    data = data.filter(f => f.title.toLowerCase().includes(filterText.toLowerCase()));
  }
  document.getElementById("compteurAcheter").innerText = `${data.length} / ${FILMS_A_ACHETER.length} films à acheter`;

  if(data.length === 0){
    grid.innerHTML = '<p style="color:#aaa; padding:20px">Aucun résultat</p>';
    return;
  }

  data.forEach(f => {
    const div = document.createElement("div");
    div.className = "card-acheter";
    div.innerHTML = `<div class="title">${f.title}</div><div class="small">${f.year} • ${f.type}</div>`;
    grid.appendChild(div);
  });
}

function showAcheter(){
  renderAcheter(document.getElementById("searchAcheter").value);
  document.getElementById("popupAcheter").style.display="flex";
  document.body.style.overflow = "hidden";
}

function closeAcheter(){
  document.getElementById("popupAcheter").style.display="none";
  document.body.style.overflow = "auto";
}

function resetFiltres(){
  document.getElementById("search").value = "";
  document.getElementById("filterType").value = "";
  document.getElementById("filterCat").value = "";
  document.getElementById("filterDecennie").value = "";
  render();
}

/* =========================
   EVENT LISTENERS
========================= */
document.getElementById("search").addEventListener("input", () => render());
document.getElementById("filterType").addEventListener("change", () => render());
document.getElementById("filterCat").addEventListener("change", () => render());
document.getElementById("filterDecennie").addEventListener("change", () => render());
document.getElementById("searchAcheter").addEventListener("input", (e) => renderAcheter(e.target.value));

document.addEventListener("DOMContentLoaded", () => {
  initFiltres();
  render();
});
