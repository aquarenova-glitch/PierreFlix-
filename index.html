  {title:"Jumanji : Bienvenue dans la jungle", year:2017, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/17/11/07/13/40/0517792.jpg", youtube:"https://youtu.be/PYzmb1563Ok", resume:"Quatre lycéens en retenue découvrent une vieille console et lancent un jeu vidéo dont ils n’ont jamais entendu parler : Jumanji. Ils sont aspirés dans la jungle et deviennent leurs avatars. Spencer le gamer timide devient le Dr Smolder Bravestone, aventurier musclé. Fridge le footeux devient Franklin 'Moose' Finbar, zoologiste gringalet. Bethany la populaire se retrouve dans la peau du Professeur Shelly Oberon, cartographe bedonnant. Martha la timide est Ruby Roundhouse, combattante redoutable. Pour sortir du jeu, ils doivent terminer le niveau et sauver Jumanji du vil Van Pelt. Mais ils n’ont que 3 vies chacun...", actors:"Dwayne Johnson, Kevin Hart, Jack Black, Karen Gillan, Nick Jonas, Alex Wolff, Madison Iseman, Ser'Darius Blain, Morgan Turner"},
  {title:"Jumanji : Next Level", year:2019, type:"DVD", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/19/11/07/12/52/2054035.jpg", youtube:"https://youtu.be/3PyBBlkAcak", resume:"L’équipe est de retour mais le jeu a changé. Spencer, nostalgique, relance Jumanji pour revivre l’aventure. Ses potes retournent dans le jeu pour le sauver, mais tout est chamboulé. Cette fois, papy Eddie et son ami Milo se retrouvent aussi aspirés. Dr Bravestone est maintenant l’avatar d’Eddie, Prof. Oberon celui de Fridge, et Mouse Finbar celui de Milo. Des déserts arides aux montagnes enneigées, ils doivent récupérer le Joyau du Faucon pour sauver Jumanji de Jürgen le Brutal. Nouveaux avatars, nouveaux pouvoirs, nouvelles règles : sortir du jeu sera encore plus dangereux.", actors:"Dwayne Johnson, Kevin Hart, Jack Black, Karen Gillan, Danny DeVito, Danny Glover, Awkwafina, Nick Jonas, Alex Wolff, Madison Iseman, Ser'Darius Blain, Morgan Turner"},
  {title:"Jumper", year:2008, type:"Blu-ray 3D", cat:"action", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/65/09/72/18888244.jpg", youtube:"https://youtu.be/RcMH5sAYc5o?is=HfKme7qm1eEb1mP2", resume:"David Rice découvre à 15 ans qu’il peut se téléporter n’importe où sur Terre. Il quitte son père violent, pille une banque et vit sans limites : surf en Australie, déjeuner sur le Sphinx, dîner à Paris. Mais il n’est pas seul. Les Paladins, menés par Roland Cox, traquent et tuent les Jumpers depuis des siècles. David retrouve Griffin, un autre Jumper, et Millie, son amour de jeunesse. Pour survivre, il devra maîtriser son don et affronter les Paladins qui veulent l’éliminer.", actors:"Hayden Christensen, Samuel L. Jackson, Jamie Bell, Rachel Bilson, Diane Lane, Michael Rooker, AnnaSophia Robb, Max Thieriot"},
 {title:"Jurassic Park", year:1993, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/20/07/21/16/53/1319265.jpg", youtube:"https://youtu.be/7cCbj-9Ww1o?is=nh15x7tGkI_EMF49", resume:"Grâce à de l'ADN de dinosaures prélevé dans un moustique fossilisé, le milliardaire John Hammond recrée plusieurs espèces et ouvre Jurassic Park sur Isla Nublar. Avant l’inauguration, il invite le paléontologue Alan Grant, la paléobotaniste Ellie Sattler, le mathématicien Ian Malcolm et ses petits-enfants Lex et Tim. Mais l’informaticien véreux Dennis Nedry coupe les systèmes de sécurité pour voler des embryons. Les dinosaures s’échappent, dont le T-Rex et les vélociraptors. La visite tourne au cauchemar : il faut survivre.", actors:"Sam Neill, Laura Dern, Jeff Goldblum, Richard Attenborough, Bob Peck, Martin Ferrero, Joseph Mazzello, Ariana Richards, Samuel L. Jackson, BD Wong, Wayne Knight"},
 {title:"Jurassic Park : Le Monde perdu", year:1997, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/00/02/11/66/affiche.jpg", youtube:"https://youtu.be/Q4lNZsbC1dg?is=Fjx7tXFCYGCy4aFz", resume:"Quatre ans après le désastre de Jurassic Park, John Hammond révèle à Ian Malcolm l’existence du Site B sur Isla Sorna : une île où les dinosaures ont été élevés avant d’être envoyés à Nublar. Hammond envoie une équipe dirigée par Sarah Harding, la compagne de Malcolm, pour étudier les dinos en liberté. Mais InGen, sous la direction du neveu de Hammond, Peter Ludlow, envoie ses propres chasseurs pour capturer les dinos et les ramener à San Diego. Les deux groupes devront s’allier pour survivre, surtout quand un T-Rex débarque en ville.", actors:"Jeff Goldblum, Julianne Moore, Pete Postlethwaite, Arliss Howard, Vince Vaughn, Vanessa Lee Chester, Richard Attenborough, Peter Stormare, Harvey Jason, Richard Schiff"},
 {title:"Jurassic Park III", year:2001, type:"DVD", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/16/41/69199752_af.jpg", youtube:"https://youtu.be/yqj6wKnS4nE?is=6iPhzQvYqHtPjQ8V", resume:"Huit ans après le désastre d’InGen, Alan Grant galère à financer ses recherches. Paul et Amanda Kirby, couple de milliardaires, lui proposent une grosse somme pour survoler Isla Sorna, le Site B. Grant accepte, mais l’avion se pose sur l’île : les Kirby cherchent en fait leur fils de 14 ans, Eric, disparu après un accident de parachute ascensionnel. L’expédition tourne au cauchemar face au Spinosaure, aux vélociraptors et aux Ptéranodons. Grant doit retrouver Eric et sortir tout le monde de l’île.", actors:"Sam Neill, William H. Macy, Téa Leoni, Alessandro Nivola, Trevor Morgan, Michael Jeter, John Diehl, Bruce A. Young"},
  {title:"Jurassic World", year:2015, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/15/04/30/15/10/422000.jpg", youtube:"https://youtu.be/wmzAfqhphq8", resume:"22 ans après la catastrophe de Jurassic Park, Isla Nublar abrite enfin un parc à thème pleinement opérationnel : Jurassic World. Des dizaines de milliers de visiteurs viennent chaque jour. Pour relancer l’intérêt, InGen crée l’Indominus Rex, un hybride génétiquement modifié, ultra-intelligent et féroce. Quand il s’échappe, le chaos éclate. Owen Grady, dresseur de vélociraptors, et Claire Dearing, directrice des opérations, doivent sauver les neveux de Claire, Zach et Gray, perdus dans le parc. Les raptors, le T-Rex et le Mosasaure seront de la partie.", actors:"Chris Pratt, Bryce Dallas Howard, Ty Simpkins, Nick Robinson, Irrfan Khan, Vincent D’Onofrio, Jake Johnson, Omar Sy, BD Wong, Judy Greer, Lauren Lapkus"},
 {title:"King Rising", year:2006, type:"DVD", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/14/08/20/13/58/596399.jpg", youtube:"https://youtu.be/hkwZFrssgUA?is=CtRx5k7AlLGnhrOb", resume:"Dans le royaume d’Ehb, un homme connu sous le nom de Farmer vit une vie paisible avec sa femme Solana et son fils. Quand les Krugs, créatures bestiales contrôlées par le sorcier Gallian, attaquent son village, tuent son fils et enlèvent Solana, Farmer découvre qu’il est en réalité le fils perdu du roi Konreid. Il rejoint une armée pour sauver sa femme et venger son fils. Avec l’aide du mage Merick et de Norick, il affronte Gallian et les Krugs pour sauver le royaume.", actors:"Jason Statham, Leelee Sobieski, John Rhys-Davies, Ron Perlman, Ray Liotta, Claire Forlani, Kristanna Loken, Matthew Lillard, Burt Reynolds"},
  {title:"Kong : Skull Island", year:2017, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/17/02/24/14/49/440855.jpg", youtube:"https://youtu.be/qIoXzukr1X4", resume:"1973. Un groupe hétéroclite d’explorateurs, de scientifiques, de soldats et d’un photographe s’aventure sur Skull Island, une île inconnue du Pacifique entourée de tempêtes. L’expédition, menée par Bill Randa de Monarch et le Lt-Colonel Packard, tourne mal quand ils larguent des bombes sismiques et réveillent Kong, un gorille de 30 mètres qui détruit leurs hélicos. Séparés, ils découvrent que Kong est le dieu de l’île et la protège des Skullcrawlers, des créatures reptiliennes géantes. Pour survivre, ils devront traverser l’île avec l’aide de Hank Marlow, un aviateur échoué là depuis 1944, et du pisteur James Conrad.", actors:"Tom Hiddleston, Samuel L. Jackson, Brie Larson, John Goodman, John C. Reilly, John Ortiz, Tian Jing, Toby Kebbell, Corey Hawkins, Jason Mitchell, Shea Whigham"},
{title:"La 7e Compagnie - Mais où est donc passé la 7e compagnie", year:1973, type:"DVD", cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/70/92/73/19117285.jpg", youtube:"https://youtu.be/3Ob1XwvGC1A?is=tmFm_Uh2gfw6HI7S", resume:"Mai 1940. Trois soldats français égarés après la débâcle, dont le caporal-chef Chaudard et le naïf Tassin, errent dans la campagne à la recherche de leur régiment, la fameuse 7e compagnie, multipliant les péripéties burlesques loin du front.", actors:"Jean Lefebvre, Pierre Mondy, Aldo Maccione"},
{title:"La 7e Compagnie - On a retrouvé la 7e Compagnie", year:1975, type:"DVD", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/36/10/49/19117291.jpg", youtube:"https://youtu.be/hEzzjK_ovx4?is=RI2gbZG8Aa1hlPke", resume:"Chaudard, Tassin et Pithivier se retrouvent en 1944, désormais résistants malgré eux, dans une France occupée par les Allemands. Toujours aussi maladroits, ils vont se retrouver mêlés à des missions de sabotage qui tournent à la farce.", actors:"Jean Lefebvre, Pierre Mondy, Henri Guybet"},
{title:"La 7e Compagnie au clair de lune", year:1977, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/70/92/68/19117255.jpg", youtube:"https://youtu.be/HRURbBzxR6w?is=1smWC8xYYYbS_yq1", resume:"En 1943, Chaudard, Tassin et Pithivier sont chargés de convoyer un prisonnier allemand jusqu'à Londres. Le trajet, semé d'embûches et de quiproquos, va une nouvelle fois mettre à l'épreuve leur sens (très relatif) de la discipline militaire.", actors:"Jean Lefebvre, Pierre Mondy, Henri Guybet"},
  {title:"La Belle et la Bête", year:2017, type:"DVD", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/17/01/16/16/04/495776.jpg", youtube:"https://youtu.be/8NilHXN3GEM", resume:"Belle, jeune fille brillante et indépendante de Villeneuve, rêve d’aventure. Son père Maurice se perd dans la forêt et se réfugie dans un château où il est fait prisonnier par une Bête terrifiante. Pour le sauver, Belle prend sa place. Dans le château enchanté, elle découvre que les objets prennent vie : Lumière, Big Ben, Mme Samovar, Plumette... Peu à peu, elle apprend à voir au-delà de l’apparence de la Bête. Mais Gaston, vaniteux et jaloux, veut épouser Belle de force et mène les villageois attaquer le château. Pour briser la malédiction, la Bête devra apprendre à aimer et se faire aimer avant que le dernier pétale de rose ne tombe.", actors:"Emma Watson, Dan Stevens, Luke Evans, Kevin Kline, Josh Gad, Ewan McGregor, Stanley Tucci, Ian McKellen, Emma Thompson, Gugu Mbatha-Raw, Audra McDonald, Nathan Mack"},
 {title:"La Doublure", year:2006, type:"DVD", cat:"comedie", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/36/21/69/18478400.jpg", youtube:"https://youtu.be/r1eg4vmeFQY?is=qQziWVgHd5cj3bCV", resume:"Surpris par un paparazzi avec Elena, son top model de maîtresse, le milliardaire Pierre Levasseur invente un mensonge pour éviter le divorce : sur la photo il y a aussi François Pignon, voiturier. Il affirme à sa femme que c’est Pignon le petit ami d’Elena. Pour rendre ça crédible, Levasseur oblige Elena à emménager chez Pignon. Elena, oiseau de paradis en HLM, chamboule la vie du modeste Pignon. Mais la cohabitation forcée va créer des situations hilarantes et des sentiments inattendus.", actors:"Gad Elmaleh, Alice Taglioni, Daniel Auteuil, Kristin Scott Thomas, Richard Berry, Virginie Ledoyen, Dany Boon, Michel Jonasz, Michel Aumont, Laurent Gamelon"},
  {title:"La Grande Muraille", year:2016, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/16/12/13/15/10/283305.jpg", youtube:"https://youtu.be/5ykbA_J97_A", resume:"William Garin et Pero Tovar, deux mercenaires européens en quête de poudre noire, sont capturés aux abords de la Grande Muraille. Ils découvrent que la muraille a été bâtie pour repousser les Tao Tei, des créatures monstrueuses qui attaquent tous les 60 ans. Emprisonnés par l’Ordre Sans Nom, une armée d’élite chinoise dirigée par la Commandante Lin Mae, ils doivent choisir : fuir ou combattre. Garin trouve sa rédemption en rejoignant les soldats dans une bataille épique contre les hordes de monstres pour sauver l’humanité.", actors:"Matt Damon, Jing Tian, Pedro Pascal, Willem Dafoe, Andy Lau, Hanyu Zhang, Eddie Peng, Lu Han, Kenny Lin, Zheng Kai"},
  {title:"Le Hobbit : Un voyage inattendu", year:2012, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/93/43/35/20273834.jpg", youtube:"https://youtu.be/tiy7peMH3g8?is=gGxQBI9-qRKB1bAW", resume:"Le hobbit Bilbon Sacquet est entraîné malgré lui dans une quête épique par le magicien Gandalf et treize nains menés par Thorin Écu-de-Chêne, bien décidés à reconquérir leur royaume perdu d'Erebor, gardé par le terrible dragon Smaug.", actors:"Martin Freeman, Ian McKellen, Richard Armitage, Andy Serkis"},
{title:"Le Hobbit : La Désolation de Smaug", year:2013, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/210/552/21055250_20131106114016251.jpg", youtube:"https://youtu.be/Rkz0chZW_VQ?is=Gbzkq086javsEP_v", resume:"Bilbon et ses compagnons poursuivent leur périlleux voyage à travers la Forêt Noire, où les attendent des araignées géantes et des elfes méfiants, avant d'atteindre enfin la Montagne Solitaire où sommeille le dragon Smaug sur son trésor.", actors:"Martin Freeman, Ian McKellen, Richard Armitage, Benedict Cumberbatch (voix de Smaug)"},
{title:"Le Hobbit : La Bataille des Cinq Armées", year:2014, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/14/11/14/17/43/568445.jpg", youtube:"https://youtu.be/E5qN3zUF3Rw?is=8gcvy-pui7v2ZVWk", resume:"Smaug déchaîne sa fureur sur la ville-lac. Pendant que Thorin sombre dans l'avidité, une immense bataille se prépare entre nains, elfes, hommes et une armée d'orques pour le contrôle de la Montagne Solitaire et de son trésor.", actors:"Martin Freeman, Ian McKellen, Richard Armitage, Orlando Bloom, Evangeline Lilly"},
{title:"La Ligne verte", year:1999, type:"DVD", cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/66/15/78/19254683.jpg", youtube:"https://youtu.be/mccs8Ql8m8o?is=mrdWuGHgeDCLN-Ra", resume:"1935, pénitencier de Cold Mountain, Louisiane. Paul Edgecomb est gardien-chef du bloc E, le couloir de la mort surnommé « la ligne verte ». Il veille à ce que les exécutions se passent dignement. Arrive John Coffey, un colosse noir condamné pour le viol et le meurtre de deux fillettes. Mais Coffey est timide, candide, a peur du noir… et possède des dons de guérison miraculeux. Paul découvre qu’il est innocent. Entre Percy Wetmore, gardien sadique, Mr Jingles la souris et la femme du directeur mourante, Paul va vivre un drame qui le hantera toute sa vie.", actors:"Tom Hanks, Michael Clarke Duncan, David Morse, Bonnie Hunt, Gary Sinise, James Cromwell, Michael Jeter, Doug Hutchison, Sam Rockwell, Barry Pepper, Patricia Clarkson, Harry Dean Stanton"},
  {title:"La Môme", year:2007, type:"DVD", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/60/15/65/18700879.jpg", youtube:"https://youtu.be/3opXXK8Udw8?is=jyFL1sCIINfhO-H9", resume:"De son enfance misérable à Belleville à la gloire internationale, de ses victoires à ses blessures, le destin hors norme d’Édith Piaf. Abandonnée par sa mère, élevée dans la maison close de sa grand-mère, rendue aveugle puis miraculeusement guérie, chanteuse des rues repérée par Louis Leplée, amoureuse de Marcel Cerdan... Intime, intense, fragile et indestructible, dévouée à son art jusqu’au sacrifice, voici l’âme d’une artiste et le cœur d’une femme devenue la plus immortelle des chanteuses françaises.", actors:"Marion Cotillard, Sylvie Testud, Pascal Greggory, Jean-Pierre Martins, Gérard Depardieu, Clotilde Courau, Jean-Paul Rouve, Marc Barbé, Caroline Sihol"},
 {title:"La Momie", year:1999, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/img/24/8f/248f908bbad1b2e10f054834b0c8f7ed.jpg", youtube:"https://youtu.be/yPcJnVJGm2U?is=QrTbK3p4plyM_qQ1", resume:"1719 av. J.-C. Pour avoir osé ravir sa fiancée au Pharaon, le grand prêtre Imhotep est momifié vivant et enseveli dans une crypte secrète d'Hamunaptra. En 1923, l’aventurier Rick O’Connell, l’égyptologue Evelyn Carnahan et son frère Jonathan découvrent les ruines d'Hamunaptra. Ils réveillent Imhotep par accident. La Momie, avide de vengeance, cherche à ressusciter son amour Ankh-Su-Namun et plonger le monde dans les ténèbres. Rick et Evy doivent stopper Imhotep avant qu’il ne devienne invincible.", actors:"Brendan Fraser, Rachel Weisz, John Hannah, Arnold Vosloo, Kevin J. O'Connor, Jonathan Hyde, Oded Fehr, Omid Djalili, Erick Avari"},
 {title:"Le Retour de la momie", year:2001, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/14/08/25/15/31/080592.jpg", youtube:"https://youtu.be/YTKALqlPhQM?is=zBfU36r-nXxXjvQK", resume:"1935. Rick O’Connell et Evelyn mènent une vie paisible à Londres avec leur fils Alex. Mais Imhotep est ressuscité au British Museum par une secte menée par Baltus Hafez et la réincarnation d’Ankh-Su-Namun, Meela. Le but : réveiller le Roi Scorpion et son armée d’Anubis pour dominer le monde. Alex se fait enlever et porte un bracelet qui mène à l’oasis d’Ahm Shere. Les O’Connell repartent à l’aventure pour sauver leur fils et empêcher Imhotep de tuer le Roi Scorpion, seule créature capable de le vaincre.", actors:"Brendan Fraser, Rachel Weisz, John Hannah, Arnold Vosloo, Oded Fehr, Patricia Velasquez, Freddie Boath, Dwayne Johnson, Alun Armstrong, Adewale Akinnuoye-Agbaje"},
  {title:"La Momie : La Tombe de l'Empereur Dragon", year:2008, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/65/21/99/18959941.jpg", youtube:"https://youtu.be/udiGxPVcts8?is=WFZ_eO7uoS3FMHV9", resume:"Rick O’Connell et Evelyn sont à la retraite, mais leur fils Alex réveille par erreur l’Empereur Dragon Han, momifié depuis 2000 ans avec son armée de terre cuite. Des catacombes de la Chine antique aux sommets de l’Himalaya, les O’Connell doivent empêcher l’Empereur de lever son armée et conquérir le monde. Pour ça, Rick, Evelyn, Alex et Jonathan affrontent la Momie ressuscitée du plus cruel conquérant de Chine, aidés par la sorcière Zi Yuan et sa fille Lin.", actors:"Brendan Fraser, Jet Li, Maria Bello, John Hannah, Luke Ford, Michelle Yeoh, Isabella Leong, Anthony Wong Chau-Sang, Russell Wong"},
  {title:"La Momie", year:2017, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/17/04/11/16/54/286958.jpg", youtube:"https://youtu.be/Dm_l21Ihuz8?is=SppKzM1l10VAb1oH", resume:"Bien qu’elle ait été consciencieusement enterrée dans un tombeau au fin fond d’un insondable désert, la princesse Ahmanet, dont le destin lui a été injustement ravi, revient à la vie. Elle va déverser sur notre monde des siècles de rancœurs accumulées et de terreur dépassant l’entendement humain. Des sables du Moyen-Orient aux pavés de Londres, Nick Morton, mercenaire, et l’archéologue Jenny Halsey vont devoir affronter cette divinité maléfique réveillée par erreur.", actors:"Tom Cruise, Sofia Boutella, Annabelle Wallis, Jake Johnson, Courtney B. Vance, Russell Crowe"},
   {title:"La Nuit au musée 3 - Le Secret des pharaons ", year:2015, type:"DVD", cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/14/11/24/15/47/543007.jpg", youtube:"https://youtu.be/LJiXswsfcmI?is=EM451ZZHxu-YeYQa", resume:"Ben Stiller réendosse le rôle de Larry, le gardien de musée le plus survolté, dans le dernier volet de la saga La Nuit au Musée. Il quitte New York pour Londres où il va vivre sa plus grande aventure. Accompagné de ses amis le Président Roosevelt, Attila, le Romain Octavius, Jedediah et le pharaon Ahkmenrah, ainsi que de nouveaux personnages délirants, il va tenter de sauver la magie avant qu’elle ne disparaisse à tout jamais.", actors:"Ben Stiller, Robin Williams, Owen Wilson"},
{title:"La Plage", year:2000, type:"DVD", cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/medias/04/64/63/046463_af.jpg", youtube:"https://youtu.be/PeMpOM9FG0Y?is=0dAAn8guvn3l4ZBT", resume:"À Bangkok, Richard, jeune Américain en quête d’aventure, rencontre Daffy, un homme au regard halluciné qui lui parle d’une île secrète avec une plage paradisiaque. Le lendemain, Richard retrouve le cadavre de Daffy et une carte de l’île. Avec Françoise et Étienne, un couple de Français, il part à la recherche de ce paradis perdu. Ils intègrent une petite communauté d’esprits libres vivant en autarcie. Mais le rêve tourne au cauchemar : secrets, paranoïa, violence... Le paradis peut vite devenir l’enfer.", actors:"Leonardo DiCaprio, Virginie Ledoyen, Guillaume Canet, Robert Carlyle, Tilda Swinton, Paterson Joseph"},
  {title:"La Planète des Singes : L'Affrontement", year:2014, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/14/07/03/16/07/192966.jpg", youtube:"https://youtu.be/Iy6yXiYMEO0?is=jZkEHw3fAEJzi1BC", resume:"10 ans après les événements des Origines, le virus ALZ-113 a décimé l’humanité. César dirige une colonie de singes génétiquement évolués dans la forêt de Muir près de San Francisco. Un groupe d’humains survivants, mené par Malcolm, cherche à remettre en marche un barrage pour retrouver de l’électricité. Une trêve fragile s’installe, mais Koba, le bonobo marqué par les expériences humaines, et Dreyfus, chef des humains, vont précipiter les deux camps dans une guerre pour savoir qui sera l’espèce dominante sur Terre.", actors:"Andy Serkis, Jason Clarke, Gary Oldman, Keri Russell, Toby Kebbell, Kodi Smit-McPhee, Kirk Acevedo, Nick Thurston, Judy Greer"},
  {title:"La Reine des Neiges", year:2013, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/210/521/21052146_20131023144339759.jpg", youtube:"https://youtu.be/-YGuR4ATIJw?feature=shared", resume:"Anna, une jeune fille aussi audacieuse qu’optimiste, se lance dans un incroyable voyage en compagnie de Kristoff, un montagnard expérimenté, et de son fidèle renne Sven à la recherche de sa sœur Elsa, la Reine des Neiges qui a plongé le royaume d’Arendelle dans un hiver éternel. En chemin, ils vont rencontrer de mystérieux trolls et un drôle de bonhomme de neige nommé Olaf, braver les conditions extrêmes des sommets escarpés et glacés, et affronter la magie qui les guette à chaque pas.", actors:"Anaïs Delva, Emmylou Homs, Donald Reignoux, Dany Boon, Richard Darbois, Bernard Alane"},
  {title:"La Soupe aux choux", year:1981, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/36/11/21/18478117.jpg", youtube:"https://youtu.be/pp1Z9RfA9FY?is=VM-wmYOHkK5G7M0a", resume:"Au hameau des Gourdiflots, dans le Bourbonnais, Le Glaude et Le Bombé, deux paysans retraités portés sur la bouteille, vivent retirés de la vie moderne. Une nuit, après un concours de pets titanesque, un extraterrestre atterrit en soucoupe volante dans le jardin du Glaude. En gage de bienvenue, ce dernier lui offre un peu de sa fameuse soupe aux choux. Conquis, l'extra-terrestre surnommé La Denrée revient régulièrement et ressuscite même la femme du Glaude. Mais le maire veut racheter leurs terrains... Les deux compères finissent par partir sur la planète Oxo.", actors:"Louis de Funès, Jean Carmet, Jacques Villeret, Christine Dejoux, Claude Gensac, Henri Génès, Marco Perrin"},
 {title:"La Totale !", year:1991, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/19/01/29/16/30/3262946.jpg", youtube:"https://youtu.be/6RIXl275_Qc?is=sz0MvN9XXNBr4tU9", resume:"François Voisin passe aux yeux des siens pour un paisible employé des télécoms. En réalité, c’est l’un des meilleurs agents secrets français, surnommé 'l’Épée'. Mais à force de neutraliser des trafiquants d’armes, il ne voit pas que sa femme Hélène s’ennuie et se laisse séduire par Simon, un mytho qui se fait passer pour agent secret. Quand François découvre ça, il pète un câble : il fait suivre sa femme, met son fils sur écoute... C’est la totale ! Il embarque toute sa famille dans ses missions, jusqu’à un affrontement avec le terroriste Sarkis.", actors:"Thierry Lhermitte, Miou-Miou, Eddy Mitchell, Michel Boujenah, Jean Benguigui, Annick Alane, Sagamore Stévenin"},
  {title:"La Traversée de Paris", year:1956, type:"DVD", cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/64/48/08/19537814.jpg", youtube:"https://youtu.be/64mfEgWuf2A?is=D9kVCj6pfyilaDO8", resume:"Paris, 1943, sous l'Occupation. Marcel Martin, chauffeur de taxi au chômage, survit en transportant de la viande au marché noir. Son acolyte habituel arrêté, il engage Grandgil, un inconnu qui se révèle incontrôlable. Les deux hommes doivent traverser Paris à pied avec quatre valises pleines de porc destinées à un boucher de la rue Lepic. Périple périlleux entre contrôles allemands et rencontres... Martin découvrira que Grandgil est en réalité un peintre célèbre qui s'est offert une petite aventure. Arrêtés, Martin paiera seul le prix de cette traversée.", actors:"Jean Gabin, Bourvil, Louis de Funès, Jeannette Batti, Robert Arnoux, Georgette Anys"},
  {title:"La Vie est belle", year:1998, type:"DVD", cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/medias/04/23/08/042308_af.jpg", youtube:"https://youtu.be/7Mmeg8zJNvU?is=FI6lLlbKsYJL7hrV", resume:"En 1938, Guido, jeune homme plein de gaieté, rêve d'ouvrir une librairie, malgré les tracasseries de l'administration fasciste. Il tombe amoureux de Dora, institutrice étouffée par le conformisme familial et l'enlève le jour de ses fiançailles avec un bureaucrate du régime. Cinq ans plus tard, Guido et Dora ont un fils: Giosue. Mais les lois raciales sont entrées en vigueur et Guido est juif. Il est alors déporté avec son fils. Par amour pour eux, Dora monte de son plein gré dans le train qui les emmène aux camps de la mort où Guido veut tout faire pour éviter l'horreur à son fils...", actors:"Roberto Benigni, Horst Buchholz, Marisa Paredes"},
{title:"La Vérité si je mens!", year:1997, type:"DVD", cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/66/05/69/18908004.jpg", youtube:"https://youtu.be/pFoN2AlF0gs?is=-0M3TyxLjoGp5rhU", resume:"Edouard Vuibert, dit Eddie, est au bout du rouleau. Après une bagarre avec des joueurs de bonneteau, Victor Benzakem, patron prospère du Sentier, le prend sous son aile en le croyant juif. Embauché comme manutentionnaire, Eddie laisse le quiproquo s'installer et gravit les échelons dans le milieu du textile. Il séduit Sandra, la fille de son patron. Mais pendant les préparatifs du mariage, il se démasque involontairement : il n’est pas juif! Scandale et colère de Sandra...", actors:"Richard Anconina, Richard Bohringer, Amira Casar, Vincent Elbaz, Aure Atika, Élie Kakou, José Garcia, Bruno Solo, Gilbert Melki"},
  {title:"La Vérité si je mens! 2", year:2001, type:"DVD", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/66/09/05/18910144.jpg", youtube:"https://youtu.be/buyJpWR8MPo?is=G8_5k7zcnSlWpxng", resume:"Eddie, Dov et Yvan galèrent dans le Sentier. Pour se relancer, ils se lancent dans la grande distribution avec la chaîne Eurodiscount. Mais ils se font arnaquer par Denis Vierhouten, directeur des achats. Ruiné, Eddie prépare sa vengeance. Pendant ce temps, la bande se disloque : Dov part en Californie, Karine chasse Dov du foyer, et Serge, devenu livreur, fait croire à Chochana Boutboul qu'il est blindé. Eddie conçoit un plan pour réunir tout le monde et se venger.", actors:"Richard Anconina, José Garcia, Bruno Solo, Gilbert Melki, Gad Elmaleh, Daniel Prévost, Aure Atika, Amira Casar, Élisa Tovati, Enrico Macias"},
  {title:"La Vérité si je mens ! 3", year:2012, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/84/17/68/19818398.jpg", youtube:"https://youtu.be/R63NpdAoTuY?is=jQst4-Zw04ulysND", resume:"Eddie et sa bande, désormais installés en Chine pour affaires, voient leur nouvelle vie menacée par la crise économique et la concurrence low-cost. Ils doivent retourner au Sentier pour tenter de sauver leur commerce et leur amitié.", actors:"Richard Anconina, José Garcia, Gilbert Melki, Bruno Solo, Vincent Elbaz"},
{title:"Le Septième Fils", year:2014, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/14/10/13/17/02/258236.jpg", youtube:"https://youtu.be/xh9YLkb3OTo?is=tg4mhoXMQvehEMfV", resume:"Il y a bien longtemps, une force maléfique menaçait de se déchaîner. Depuis des siècles, le chevalier Maître Gregory retient prisonnière la sorcière Mère Malkin. Mais elle s’échappe et prépare sa vengeance. Seul Gregory peut l’arrêter. Il doit former Tom Ward, son nouvel apprenti, septième fils d’un septième fils, à combattre la magie noire. Problème : il n’a que quelques jours avant la prochaine pleine lune, alors qu’il faut des années pour former un épouvanteur. Le dernier espoir de l’humanité repose sur Tom.", actors:"Jeff Bridges, Julianne Moore, Ben Barnes, Alicia Vikander, Kit Harington, Djimon Hounsou, Antje Traue, Olivia Williams"},
  {title:"Le Boulet", year:2002, type:"DVD", cat:"comedie", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/34/80/boulet.jpg", youtube:"https://youtu.be/soY-pkSygaY?is=y97XqOvrCMLrWsSA", resume:"Moltès, un détenu, joue chaque semaine au loto. C'est Reggio, un gardien de prison maladroit, qui valide ses bulletins. Un jour, Moltès apprend qu'il a gagné le jackpot : quinze barres! Mais Reggio croit que Pauline, sa femme infirmière, est partie avec le ticket gagnant en Afrique sur un rallye. Moltès s'évade alors de prison direction Bamako pour récupérer le billet. Il force Reggio à l'accompagner et se retrouve poursuivi en plein désert par Le Turc, un redoutable gangster qui veut sa peau, et Le Meg, son garde du corps.", actors:"Gérard Lanvin, Benoît Poelvoorde, José Garcia, Rossy de Palma, Djimon Hounsou, Gérard Darmon, Jean Benguigui, Omar Sy, Stomy Bugsy, Jamel Debbouze"},
  {title:"Le Cercle des poètes disparus", year:1989, type:"DVD", cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/48/82/affiche.jpg", youtube:"https://youtu.be/G0XmQQi0fw0?is=cU1rSqzhjJ350eI2", resume:"1959, à la très stricte académie Welton. John Keating, professeur de littérature anglophone aux méthodes anticonformistes, bouscule les traditions. Il encourage ses élèves à refuser le conformisme, à faire vivre la poésie et à saisir l’instant présent : 'Carpe Diem'. Ses cours redonnent le goût de la liberté à Todd, Neil, Knox et leurs camarades qui ressuscitent le Cercle des poètes disparus. Mais l’esprit libre enseigné par Keating se heurte à l’autorité du directeur Nolan...", actors:"Robin Williams, Robert Sean Leonard, Ethan Hawke, Josh Charles, Gale Hansen, Dylan Kussman, Kurtwood Smith"},
  {title:"Le Choc des Titans", year:2010, type:"Blu-ray 3D", cat:"peplum", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/70/88/43/19255647.jpg", youtube:"https://youtu.be/yFuDIBPqvzc?is=DhiXxmtbkZqgk3TE", resume:"Persée est un demi-dieu : fils de Zeus mais élevé par les hommes. Il ne peut sauver sa famille des griffes d'Hadès, Dieu des Enfers. N'ayant plus rien à perdre, Persée se porte volontaire pour une mission périlleuse : affronter les créatures d'Hadès pour empêcher celui-ci de s'emparer du pouvoir de Zeus et de faire régner l'enfer sur Terre. À la tête d'une troupe de guerriers, il entreprend un voyage dans les mondes interdits et doit accepter son pouvoir de dieu pour survivre.", actors:"Sam Worthington, Liam Neeson, Ralph Fiennes, Gemma Arterton, Mads Mikkelsen, Jason Flemyng, Nicholas Hoult, Danny Huston, Alexa Davalos"},
 {title:"La Colère des Titans", year:2012, type:"Blu-ray 3D", cat:"peplum", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/86/82/23/20043761.jpg", youtube:"https://youtu.be/uC2XGbm4Mc0?is=6biffPolQgDeoSG4", resume:"Dix ans après avoir vaincu le Kraken, Persée, fils demi-dieu de Zeus, vit en paix comme pêcheur et élève seul son fils Hélius. Mais les dieux s’affaiblissent car les hommes ne prient plus. Hadès et Arès trahissent Zeus et s’allient à Cronos, leur père, emprisonné dans le Tartare, pour le libérer. Zeus est capturé. Avec l’aide d’Andromède, d’Agénor fils de Poséidon et d’Héphaïstos, Persée descend aux Enfers pour sauver son père, empêcher le réveil de Cronos et éviter que les Titans ne détruisent le monde.", actors:"Sam Worthington, Liam Neeson, Ralph Fiennes, Edgar Ramírez, Toby Kebbell, Rosamund Pike, Bill Nighy, Danny Huston, Lily James"},
 {title:"Le Dernier Loup", year:2015, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/15/08/12/15/50/562826.jpg", youtube:"https://youtu.be/06zMlGFBCoI?is=hlhH9nEj8FYdGv0F", resume:"1969. Chen Zhen, jeune étudiant pékinois, est envoyé en Mongolie-Intérieure pour éduquer une tribu de bergers nomades. Mais c’est lui qui va apprendre : la vie dans ces steppes hostiles, la liberté, la communauté... et surtout le lien quasi mystique entre les bergers et le loup, créature sacrée et redoutée. Fascinée, Chen capture un louveteau pour l’apprivoiser. Mais cette relation naissante, la vie traditionnelle de la tribu et l’avenir de la terre sont menacés quand un officier du gouvernement décide d’exterminer tous les loups de la région.", actors:"Feng Shaofeng, Shawn Dou, Ankhnyam Ragchaa, Yin Zhusheng, Basen Zhabu"},
 {title:"Le Dernier Samaritain", year:1991, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/22/06/01/14/25/0574663.jpg", youtube:"https://youtu.be/gQqOXZ4N7Qs?is=Bcs-syS7ZHdQajE-", resume:"Joe Hallenbeck, détective privé alcoolique et cynique, ex-agent des services secrets, fait équipe avec Jimmy Dix, ancien quarterback star tombé pour drogue. Quand Cory, strip-teaseuse et petite amie de Jimmy, est assassinée, ils plongent dans une affaire mêlant chantage, paris truqués et magouilles politiques dans le milieu du football américain. Sur leur route : Sheldon Marcone, patron véreux, Milo le tueur, et une conspiration qui remonte jusqu’au Sénat.", actors:"Bruce Willis, Damon Wayans, Chelsea Field, Noble Willingham, Danielle Harris, Halle Berry, Bruce McGill, Kim Coates, Taylor Negron"},
 {title:"Le Dernier Samouraï", year:2003, type:"DVD", cat:"action", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/35/14/62/18369417.jpg", youtube:"https://youtu.be/7Gd6Y38VGLI?is=EHw87LmVoMLv-DrR/", resume:"En 1876, le capitaine Nathan Algren, vétéran de la guerre de Sécession hanté par les massacres des Indiens, est engagé pour entraîner l’armée moderne de l’empereur Meiji au Japon. Capturé par Katsumoto, chef des samouraïs rebelles, il découvre leur code d’honneur et leur mode de vie menacé par la modernisation forcée. Pris entre deux mondes, Algren choisit de combattre aux côtés des samouraïs pour préserver leurs traditions face à l’armée impériale.", actors:"Tom Cruise, Ken Watanabe, Hiroyuki Sanada, Koyuki, Timothy Spall, Tony Goldwyn, Billy Connolly, Masato Harada, Shin Koyamada"},
  {title:"Le Flic de Beverly Hills", year:1984, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/18/09/12/09/49/3984226.jpg", youtube:"https://youtu.be/dPSyaNQ4ZUs?is=cBPm9DRBLl6Z8htb", resume:"Axel Foley, policier de Detroit aux méthodes peu orthodoxes, part enquêter à Beverly Hills sur le meurtre d'un ami. Son sens de l'improvisation et son insolence vont bousculer les habitudes très policées de la police locale.", actors:"Eddie Murphy, Judge Reinhold, John Ashton, Ronny Cox"},
{title:"Le Flic de Beverly Hills 2", year:1987, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/18/07/19/10/30/5212756.jpg", youtube:"https://youtu.be/wlCdH8GfOYQ?is=zo2VNrQQmjiIHqlM", resume:"Axel Foley revient à Beverly Hills quand son ami le capitaine Bogomil est victime d'une tentative de meurtre. Il enquête sur un gang de braqueurs surnommé les 'Alphabet Bandits', impliqué dans un trafic d'armes de grande envergure.", actors:"Eddie Murphy, Judge Reinhold, John Ashton, Brigitte Nielsen"},
{title:"Le Flic de Beverly Hills 3", year:1994, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/78/59/49/19469292.jpg", youtube:"https://youtu.be/6g3eCmTWK3U?is=zc23-37BejNXOc0u", resume:"Axel Foley enquête cette fois dans un parc d'attractions de Beverly Hills où son mentor a été assassiné. Il découvre un trafic de fausse monnaie dissimulé derrière la façade familiale du parc.", actors:"Eddie Murphy, Judge Reinhold, Hector Elizondo, Timothy Carhart"},
{title:"Le Fugitif", year:1993, type:"DVD", cat:"action", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/62/56/11/20279724.jpg", youtube:"https://youtu.be/YMvKaIfIrFk?is=OUWoRwFFzt-aCDJs", resume:"À Chicago, le Dr Richard Kimble, chirurgien vasculaire renommé, rentre chez lui et découvre le corps de sa femme assassinée. Accusé à tort du meurtre, il est condamné. Lors du transfert en prison, le bus déraille et Kimble s’évade. Traqué par le marshal Samuel Gerard, il mène sa propre enquête pour prouver son innocence et retrouver le véritable tueur, un manchot aperçu sur la scène de crime.", actors:"Harrison Ford, Tommy Lee Jones, Sela Ward, Joe Pantoliano, Andreas Katsulas, Jeroen Krabbé, Julianne Moore"},
{title:"Le Grand Bleu", year:1988, type:"DVD", cat:"drame", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/14/08/21/14/09/379570.jpg", youtube:"https://youtu.be/xGmVAPwWwSM?is=NxI3FtdN1Pxv3EHd", resume:"Enfants, Jacques Mayol et Enzo Molinari partagent la même passion pour la plongée en apnée. Devenus adultes, ils se retrouvent lors du championnat du monde en Sicile. Leur rivalité les pousse à repousser les limites humaines dans les profondeurs. Entre eux, Johana, une jeune femme éprise de Jacques, qui tente de comprendre cet homme fasciné par les dauphins et qui semble appartenir à la mer plus qu’à la terre.", actors:"Jean-Marc Barr, Jean Reno, Rosanna Arquette, Paul Shenar, Sergio Castellitto, Jean Bouise"},
 {title:"Le Grand Chemin", year:1987, type:"DVD", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/23/06/28/10/30/2209597.jpg", youtube:"https://youtu.be/iFg_rpgty20?is=wV-e62_n3rRcQ8fg", resume:"Été 1959. Claire, enceinte et abandonnée par le père de ses enfants, confie son fils aîné Louis, 9 ans, à ses amis Marcelle et Pelo qui vivent à Rouans, en campagne nantaise. Le petit Parisien découvre la vie rurale avec Martine, la voisine espiègle de 10 ans. Peu à peu, il s’attache à Pelo mais sent la tension entre le couple : Pelo boit et Marcelle porte un lourd secret. L’arrivée de Louis va bouleverser leur existence.", actors:"Anémone, Richard Bohringer, Antoine Hubert, Vanessa Guedj, Christine Pascal, Pascale Roberts"},
 {title:"Le Monde de Narnia : L'Odyssée du Passeur d'Aurore", year:2010, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/78/19/25/19539619.jpg", youtube:"https://youtu.be/8wat1vJDHtY?is=7NkFakkpnL062DWw", resume:"Edmund, Lucy et leur insupportable cousin Eustache sont transportés à travers un tableau sur le magnifique navire le Passeur d’Aurore. Ils retrouvent le roi Caspian et la souris guerrière Ripitchip pour une mission vitale : retrouver sept seigneurs bannis et sauver Narnia d’une brume verte maléfique. Ils découvriront des îles mystérieuses, des créatures magiques, un étang qui change tout en or, et affronteront leurs tentations avant de rejoindre Aslan au bout du monde.", actors:"Georgie Henley, Skandar Keynes, Ben Barnes, Will Poulter, Liam Neeson, Simon Pegg, Tilda Swinton"},
  {title:"Le Monde fantastique d'Oz", year:2013, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/91/98/08/20453482.jpg", youtube:"https://youtu.be/0P8ATgTj-N4?is=xoXMz1nGxsKo0BG8", resume:"Oscar Diggs, magicien de foire sans envergure à la moralité douteuse, est emporté du Kansas poussiéreux jusqu’au luxuriant Pays d’Oz. Pris pour le grand magicien annoncé par la prophétie, il rencontre trois sorcières : Théodora, Evanora et Glinda. Entre illusions, ingéniosité et un soupçon de sorcellerie, Oscar devra choisir entre fuir ou se battre pour sauver Oz, et se transformer en un homme meilleur.", actors:"James Franco, Mila Kunis, Rachel Weisz, Michelle Williams, Zach Braff, Bill Cobbs, Joey King, Tony Cox"},
  {title:"Le Négociateur", year:1998, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/04/30/64/043064_af.jpg", youtube:"https://youtu.be/ca3wwa_5sto?is=p8pqYu3zLJGZ7kSm", resume:"Danny Roman, négociateur d'élite de la police de Chicago, est accusé à tort du meurtre de son coéquipier et de détournement de fonds. Pour prouver son innocence, il prend en otage Niebaum, chef des affaires internes, et plusieurs personnes dans son bureau. Il exige qu’un autre négociateur, Chris Sabian, vienne pour le raisonner. Commence alors un duel psychologique tendu où Roman doit démasquer le vrai coupable avant que les forces d’intervention ne donnent l’assaut.", actors:"Samuel L. Jackson, Kevin Spacey, David Morse, Ron Rifkin, John Spencer, J.T. Walsh, Paul Giamatti"},
  {title:"Le Patriote", year:2000, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/86/66/97/19853893.jpg", youtube:"https://youtu.be/iAjn_UViuE0?is=4OY3m3WaXwB3k-fA", resume:"1776, Caroline du Sud. Benjamin Martin, ancien héros de guerre veuf et père de 7 enfants, veut rester à l’écart du conflit entre indépendantistes et Anglais. Mais quand son fils aîné Gabriel s’engage et que le colonel Tavington tue son deuxième fils Thomas, Martin prend les armes. Il lève une milice et mène une guérilla sanglante contre les tuniques rouges pour venger sa famille et libérer les colonies.", actors:"Mel Gibson, Heath Ledger, Joely Richardson, Jason Isaacs, Chris Cooper, Tchéky Karyo, Tom Wilkinson"},
 {title:"Le Pic de Dante", year:1997, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/66/42/15/18965592.jpg", youtube:"https://share.google/UVLYI826BJ6zlHDE6", resume:"Harry Dalton, volcanologue, est envoyé à Dante’s Peak, petite ville sous la menace du volcan éteint qui la surplombe. Malgré ses alertes, le conseil municipal refuse d’évacuer. Quand l’éruption devient imminente, Harry doit sauver Rachel, la maire, et ses enfants piégés par la lave et les coulées pyroclastiques.", actors:"Pierce Brosnan, Linda Hamilton, Charles Hallahan, Elizabeth Hoffman, Jamie Renée Smith"},
 {title:"Le Prénom", year:2012, type:"DVD", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/86/88/02/20057116.jpg", youtube:"https://www.youtube.com/watch?v=9bgb5_kVR4E", resume:"Vincent, la quarantaine triomphante, va être père pour la première fois. Invité à dîner chez Élisabeth et Pierre, sa soeur et son beau-frère, il y retrouve Claude, un ami d’enfance. En attendant l’arrivée d’Anna, sa jeune épouse, on le presse de questions sur sa future paternité. Mais quand on demande à Vincent s’il a déjà choisi un prénom pour l’enfant à naître, sa réponse plonge la famille dans le chaos.", actors:"Patrick Bruel, Valérie Benguigui, Charles Berling, Guillaume de Tonquédec, Judith El Zein, Françoise Fabian"},
 {title:"Le Règne du feu", year:2002, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/00/02/48/70/affiche1.jpg", youtube:"https://share.google/RCfeDyipH5uEcRZyV", resume:"Londres, 2008. Lors de travaux dans le métro, un dragon millénaire est réveillé. 20 ans plus tard, les dragons dominent la Terre en ruines. Quinn dirige une communauté de survivants dans un château. L’arrivée de Van Zan, militaire US, va lancer la reconquête pour tuer le seul mâle reproducteur.", actors:"Christian Bale, Matthew McConaughey, Izabella Scorupco, Gerard Butler, Scott Moutter"},
 {title:"Le Roi Lion", year:1994, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/22/09/20/12/10/2512840.jpg", youtube:"https://youtu.be/mOXKWZGjODE?feature=shared", resume:"Simba, jeune lionceau fils du roi Mufasa, est exilé après la mort de son père orchestrée par son oncle Scar. Recueilli par Timon et Pumbaa, il grandit loin des responsabilités. Adulte, Nala le retrouve et le pousse à reprendre sa place de roi sur la Terre des Lions.", actors:"Voix VO : Matthew Broderick, James Earl Jones, Jeremy Irons | Voix VF : Emmanuel Curtil, Jean Reno, Med Hondo"},
  {title:"Le Seigneur des anneaux : La Communauté de l'Anneau", year:2001, type:"Blu-ray ", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/00/02/16/27/69218096_af.jpg", youtube:"https://share.google/s9mY74Ylwy2hc69As", resume:"Le jeune hobbit Frodon Sacquet hérite de l'Anneau Unique, instrument de pouvoir absolu de Sauron. Avec Gandalf, Aragorn, Legolas, Gimli, Boromir et ses amis hobbits Sam, Merry et Pippin, il forme la Communauté de l'Anneau pour détruire l'Anneau dans les flammes de la Montagne du Destin en Mordor.", actors:"Elijah Wood, Ian McKellen, Viggo Mortensen, Sean Astin, Liv Tyler, Billy Boyd, Orlando Bloom, Cate Blanchett, Christopher Lee, John Rhys-Davies, Sean Bean"},
 {title:"Le Seigneur des anneaux : Les Deux Tours", year:2002, type:"Blu-ray ", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/00/02/54/95/affiche2.jpg", youtube:"https://share.google/rfYgRR6kMJjrnyCMR", resume:"La Communauté est brisée. Frodon et Sam, guidés par Gollum, poursuivent vers le Mordor pour détruire l'Anneau. Aragorn, Legolas et Gimli partent au secours de Merry et Pippin capturés par les Uruk-hai. Le Rohan se prépare à la guerre contre Saroumane lors de la bataille du Gouffre de Helm, tandis que Gandalf revient plus puissant.", actors:"Elijah Wood, Ian McKellen, Viggo Mortensen, Sean Astin, Orlando Bloom, John Rhys-Davies, Andy Serkis, Christopher Lee, Bernard Hill, Miranda Otto, Karl Urban, David Wenham"},
 {title:"Le Seigneur des anneaux : Le Retour du Roi", year:2003, type:"Blu-ray ", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/14/33/18366630.jpg", youtube:"https://www.youtube.com/watch?v=RCuDRcK0BBM", resume:"La bataille pour la Terre du Milieu a commencé. Frodon et Sam, guidés par Gollum, poursuivent leur mission à travers les terres du Mordor pour détruire l'Anneau Unique. Tandis que le pouvoir de Sauron grandit, Aragorn, l'héritier du trône du Gondor, rassemble l'armée des Hommes contre les forces du Mal pour la bataille de Minas Tirith et la Porte Noire.", actors:"Elijah Wood, Ian McKellen, Viggo Mortensen, Sean Astin, Orlando Bloom, John Rhys-Davies, Andy Serkis, Liv Tyler, Cate Blanchett, Billy Boyd, Dominic Monaghan, Bernard Hill, Miranda Otto, Karl Urban, David Wenham"},
 {title:"Les 101 Dalmatiens", year:1961, type:"DVD", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/65/83/79/20193459.jpg", youtube:"https://www.youtube.com/watch?v=vLDG-clwUpw", resume:"À Londres, Pongo et Perdita, deux dalmatiens, mènent une vie paisible avec leurs maîtres Roger et Anita et leurs 15 chiots. Mais Cruella d’Enfer rêve d’un manteau en fourrure de dalmatiens. Elle fait enlever la portée. Pongo et Perdita lancent une vaste opération de sauvetage avec l’aide de tous les chiens du pays.", actors:"Voix VO : Rod Taylor, Cate Bauer, Betty Lou Gerson | Voix VF : Roger Rudel, Lita Recio, Claude Bertrand"},
{title:"Les Affranchis", year:1990, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/00/02/56/92/aff.jpg", youtube:"https://www.youtube.com/watch?v=0v0NUEmeqbI", resume:"Depuis l’enfance, Henry Hill rêve de devenir gangster. Ado dans les années 50, il travaille pour Paul Cicero et admire Jimmy Conway. Il participe au casse de l’aéroport d’Idlewild, épouse Karen, et plonge dans le trafic de drogue. Son ascension et sa chute dans la mafia new-yorkaise, entre loyauté, trahison et paranoïa.", actors:"Robert De Niro, Ray Liotta, Joe Pesci, Lorraine Bracco, Paul Sorvino, Frank Vincent"},
  {title:"Les Animaux fantastiques", year:2016, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/16/10/11/09/32/205295.jpg", youtube:"https://www.youtube.com/watch?v=vI7PBqd_HIM", resume:"1926. Norbert Dragonneau débarque à New York avec une valise remplie de créatures magiques. Quand certaines s’échappent, il doit les retrouver avec l’aide de Tina Goldstein, sa sœur Queenie et Jacob, un Non-Maj. Leur quête révèle une menace plus sombre qui pèse sur le monde des sorciers.", actors:"Eddie Redmayne, Katherine Waterston, Dan Fogler, Alison Sudol, Colin Farrell, Ezra Miller, Samantha Morton"},
  {title:"Les Animaux fantastiques : Les Crimes de Grindelwald", year:2018, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/18/10/10/11/16/4794693.jpg", youtube:"https://www.youtube.com/watch?v=iYAb5hiTW6E", resume:"1927. Grindelwald s’évade et rallie des partisans pour soumettre les Moldus. Dumbledore demande à Norbert Dragonneau de l’arrêter. Avec Tina, Queenie et Jacob, Norbert se rend à Paris pour retrouver Croyance, dont la véritable identité pourrait faire basculer la guerre dans le monde des sorciers.", actors:"Eddie Redmayne, Katherine Waterston, Dan Fogler, Alison Sudol, Ezra Miller, Jude Law, Johnny Depp, Zoë Kravitz, Callum Turner, Claudia Kim"},
  {title:"Les Animaux fantastiques : Les Secrets de Dumbledore", year:2022, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/22/03/16/15/20/0170262.jpg", youtube:"https://www.youtube.com/watch?v=k39acJCDSKY", resume:"1932. Grindelwald cherche à prendre le contrôle du monde des sorciers. Incapable de l’arrêter seul, Dumbledore confie à Norbert Dragonneau une mission : réunir une équipe de sorciers, sorcières et un Moldu pour déjouer les plans du mage noir. Entre animaux fantastiques, trahisons et révélations, l’avenir du monde magique se joue à Berlin et au Bhoutan.", actors:"Eddie Redmayne, Jude Law, Mads Mikkelsen, Ezra Miller, Dan Fogler, Alison Sudol, Callum Turner, Jessica Williams, Katherine Waterston"},
 {title:"Les Aristochats", year:1970, type:"DVD", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/71/01/13/20193406.jpg", youtube:"https://www.youtube.com/watch?v=zn52TfjYX8s", resume:"Paris, 1910. Madame de Bonnefamille lègue sa fortune à Duchesse et ses trois chatons : Marie, Toulouse et Berlioz. Edgar, son maître d’hôtel jaloux, les kidnappe et les abandonne à la campagne. Avec l’aide d’O’Malley, un chat de gouttière débrouillard, et ses amis musiciens de jazz, ils vont tenter de rentrer à Paris.", actors:"Voix VO : Phil Harris, Eva Gabor, Sterling Holloway | Voix VF : Claude Bertrand, Michèle André, Roger Carel"},
  {title:"Les Aventures de Tintin : Le Secret de la Licorne", year:2011, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/64/08/55/19798422.jpg", youtube:"https://www.youtube.com/watch?v=pFaE9MK24sM", resume:"Après avoir acheté la maquette d’un galion nommé La Licorne, Tintin se retrouve embarqué dans une chasse au trésor. Avec Milou, le capitaine Haddock et les Dupondt, il affronte Sakharine pour percer le secret du chevalier de Hadoque et retrouver l’épave qui renferme un fabuleux trésor maudit.", actors:"Jamie Bell, Andy Serkis, Daniel Craig, Simon Pegg, Nick Frost, Gad Elmaleh"},
  {title:"Les Bronzés font du ski", year:1979, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/17/01/17/16/24/593647.jpg", youtube:"https://www.youtube.com/watch?v=9me_K_QtKrA", resume:"Un an après leurs vacances en Côte d’Ivoire, la bande se retrouve à Val-d’Isère. Entre Popeye qui ment sur son statut, Jean-Claude Dusse qui drague en vain, et une sortie en hors-piste qui tourne mal, les Bronzés enchaînent les galères. Secourus par des paysans, ils goûtent la foune et la liqueur d’échalote avant de rentrer à Paris.", actors:"Josiane Balasko, Michel Blanc, Marie-Anne Chazel, Christian Clavier, Gérard Jugnot, Thierry Lhermitte, Dominique Lavanant, Maurice Chevit"},
  {title:"Les Bronzés 3 : Amis pour la vie", year:2006, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/36/00/27/18467807.jpg", youtube:"https://www.youtube.com/watch?v=U6TRsXveaoM", resume:"27 ans après la Côte d’Ivoire et Val d’Isère, la bande se retrouve au Prunus Resort, hôtel de luxe tenu par Popeye et sa femme Graziella. Entre règlements de comptes, crises de la cinquantaine, problèmes de prostate et souvenirs qui refont surface, les Bronzés sont toujours là… les mêmes, en pire.", actors:"Josiane Balasko, Michel Blanc, Marie-Anne Chazel, Christian Clavier, Gérard Jugnot, Thierry Lhermitte, Dominique Lavanant, Martin Lamotte, Ornella Muti"},
{title:"Les Croods", year:2013, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/95/10/55/20502139.jpg", youtube:"https://www.youtube.com/watch?v=9RfgCxNtrWA", resume:"À l’ère Croodéolithique, la famille Crood doit quitter sa caverne détruite. Guidés par Guy, un nomade inventif dont Eep tombe amoureuse, Grug et les siens découvrent un monde dangereux mais fascinant. Entre peur du changement et survie, ils apprennent que la famille est leur plus grande force.", actors:"Voix VO : Nicolas Cage, Emma Stone, Ryan Reynolds, Catherine Keener | Voix VF : Kev Adams, Bérengère Krief"},
 {title:"Les gardiens de la galaxie Vol.3", year:2023, type:"Blu-ray", cat:"sf", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/23/02/13/11/43/2783447.jpg", youtube:"https://youtu.be/0RsvBSFm938?is=9mD6_Sgr_JO_wiHA", resume:"Notre bande de marginaux favorite a quelque peu changé. Peter Quill, qui pleure toujours la perte de Gamora, doit rassembler son équipe pour défendre l’univers et protéger l’un des siens. En cas d’échec, cette mission pourrait bien marquer la fin des Gardiens tels que nous les connaissons.", actors:"Chris Pratt, Zoe Saldana, Dave Bautista"},
 {title:"Les Goonies", year:1985, type:"DVD", cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/66/14/37/18957591.jpg", youtube:"https://www.youtube.com/watch?v=E71-hjH_7Rw", resume:"Astoria, 1985. Pour sauver leur quartier menacé par un promoteur, la bande des Goonies suit une vieille carte au trésor de Willy-le-Borgne. Pièges, souterrains et la famille Fratelli en cavale : l’aventure culte des années 80 signée Richard Donner et produite par Spielberg.", actors:"Sean Astin, Josh Brolin, Jeff Cohen, Corey Feldman, Kerri Green, Martha Plimpton, Jonathan Ke Quan, Robert Davi, Joe Pantoliano, Anne Ramsey"},
  {title:"Les Immortels", year:2011, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/83/63/36/19844611.jpg", youtube:"https://www.youtube.com/watch?v=jHzf9-kGZsM", resume:"Grèce antique. Le roi Hypérion veut libérer les Titans avec l’arc d’Épire pour renverser les dieux de l’Olympe. Zeus choisit Thésée, un jeune mortel, pour mener la résistance. Avec l’oracle Phèdre, il doit empêcher Hypérion de plonger l’humanité dans le chaos.", actors:"Henry Cavill, Mickey Rourke, Luke Evans, John Hurt, Freida Pinto, Stephen Dorff, Isabel Lucas, Kellan Lutz"},
  {title:"Les Infidèles", year:2012, type:"Blu-ray", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/83/85/95/20004868.jpg", youtube:"https://www.youtube.com/watch?v=QNAiI6n4v9s", resume:"L’infidélité masculine dans tous ses états : 7 sketches réalisés par 7 réalisateurs. Fred et Greg draguent en boîte, Bernard finit à l’hôpital après une soirée qui dérape, Laurent tente de tromper sa femme en séminaire… Avec Jean Dujardin, Gilles Lellouche, Guillaume Canet et la troupe du Splendid, la comédie qui ose tout.", actors:"Jean Dujardin, Gilles Lellouche, Guillaume Canet, Alexandra Lamy, Géraldine Nakache, Mathilda May, Sandrine Kiberlain, Éric Lartigau"},
{title:"Les Ripoux", year:1984, type:"DVD", cat:"comedie", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/63/71/44/18698299.jpg", youtube:"https://youtu.be/3HyHTUjUkfs?is=f90wgE8qmSEiPDc5", resume:"René, vieux policier du quartier Pigalle habitué à arrondir ses fins de mois par des petites combines, se voit imposer François, jeune inspecteur fraîchement sorti de l'école et incorruptible. Leur duo va évoluer au fil de leurs magouilles communes.", actors:"Philippe Noiret, Thierry Lhermitte, Régine"},
{title:"Ripoux contre ripoux", year:1990, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/36/10/53/18869535.jpg", youtube:"https://youtu.be/reS7cQGErTQ?is=4VL4XqoQlIgeLfxp", resume:"René et François, désormais tous deux corrompus, doivent faire face à l'arrivée d'un nouveau commissaire bien décidé à faire le ménage dans la police. Les deux compères vont devoir ruser pour continuer leurs petites affaires.", actors:"Philippe Noiret, Thierry Lhermitte, Grace de Capitani"},
{title:"Ripoux 3", year:2003, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/15/46/18364803.jpg", youtube:"https://youtu.be/1e-tck1gQ-c?is=EQY6jpPqZMMNornM", resume:"À la retraite, René coule des jours tranquilles jusqu'à ce que François, désormais commissaire, vienne le rechercher pour l'aider à démasquer un réseau de trafiquants qui infiltre son commissariat.", actors:"Philippe Noiret, Thierry Lhermitte, Cyrielle Clair"},
{title:"Les Simpson, le film", year:2007, type:"Blu-ray", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/62/92/90/18780031.jpg", youtube:"https://youtu.be/wCBUTdP50Wg?is=HmYddUngLhc8tgew", resume:"Après avoir pollué le lac de Springfield, Homer provoque une catastrophe écologique qui pousse le gouvernement à isoler la ville sous une immense cloche de verre. La famille Simpson doit fuir et réparer les dégâts avant qu'il ne soit trop tard.", actors:"Voix VF : Philippe Peythieu, Véronique Augereau, Nancy Cartwright"},
  {title:"Les Trois Frères", year:1995, type:"DVD", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/68/03/15/19007974.jpg", youtube:"https://www.youtube.com/watch?v=vy_dzIuPjpM", resume:"Bernard, Didier et Pascal ne se connaissent pas. Convoqués chez un notaire, ils découvrent qu’ils sont demi-frères et héritent de 3 millions. Mais avant de toucher l’argent, les galères s’enchaînent : Bernard camelot rêve de cinéma, Didier vigile doit épouser la fille du patron, et Pascal cadre dynamique se fait virer. Culte des Inconnus.", actors:"Didier Bourdon, Bernard Campan, Pascal Légitimus, Antoine Du Merle, Anne Jacquemin, Marine Jolivet, Pierre Meyrand, Bernard Farcy"},
 {title:"Les Trois Frères, le retour", year:2014, type:"DVD", cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/13/12/26/10/26/068920.jpg", youtube:"https://www.youtube.com/watch?v=NATQLWnPb_w", resume:"15 ans après, Didier, Bernard et Pascal sont convoqués chez le notaire : leur mère est morte aux États-Unis. Ils rêvent d’un nouvel héritage… mais ne récupèrent que son urne et une grosse dette. Ruinés, les trois frères repartent dans une série de galères hilarantes, entre Sarah la fille de Bernard et de nouveaux plans foireux.", actors:"Didier Bourdon, Bernard Campan, Pascal Légitimus, Sofia Lesaffre, Antoine du Merle, Fatima Adoum, Christian Hecq"},
  {title:"Les Trois Mousquetaires", year:2011, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/85/68/37/19800815.jpg", youtube:"https://www.youtube.com/watch?v=vDN-j6_wiFI", resume:"Nouvelle adaptation 3D du roman d’Alexandre Dumas. Le jeune D’Artagnan monte à Paris pour devenir mousquetaire et s’allie à Athos, Porthos et Aramis. Ensemble, ils déjouent les complots du cardinal de Richelieu et de Milady pour sauver l’honneur de la Reine et le trône de France. Action et aventure version steampunk.", actors:"Logan Lerman, Milla Jovovich, Matthew Macfadyen, Ray Stevenson, Luke Evans, Orlando Bloom, Christoph Waltz, Mads Mikkelsen"},
  {title:"Les Visiteurs", year:1993, type:"DVD", cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/36/07/69/18659413.jpg", youtube:"https://www.youtube.com/watch?v=EFp7mBA5hIs", resume:"En 1122, le comte Godefroy de Montmirail tue accidentellement le père de sa fiancée à cause d’un sortilège. Pour réparer son erreur, l’enchanteur Eusaebius l’envoie dans le passé… mais se trompe de date. Godefroy et son écuyer Jacquouille la Fripouille débarquent en 1992 et sèment la panique chez leurs descendants. Culte!", actors:"Jean Reno, Christian Clavier, Valérie Lemercier, Marie-Anne Chazel, Christian Bujeau, Isabelle Nanty, Didier Pain, Gérard Séty"},
 {title:"Les Voyages de Gulliver", year:2010, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/78/34/85/19623700.jpg", youtube:"https://www.youtube.com/watch?v=bkDGnNE_GGE", resume:"Lemuel Gulliver, modeste employé au courrier d'un journal new-yorkais, échoue après une tempête sur l'île de Lilliput, peuplée d'habitants minuscules. Devenu un géant à leurs yeux, il va les aider à affronter leurs ennemis tout en apprenant à s'affirmer.", actors:"Jack Black, Jason Segel, Emily Blunt, Amanda Peet"},
 {title:"Looper", year:2012, type:"Blu-ray", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/89/98/30/20239211.jpg", youtube:"https://www.youtube.com/watch?v=gGilaY_V3OQ", resume:"2044. Joe est un Looper : tueur à gages pour la mafia qui élimine des cibles envoyées depuis 2074. Le contrat est simple jusqu’au jour où sa prochaine victime est… lui-même, 30 ans plus tard. Quand son double du futur s’échappe, Joe doit le traquer pour sauver sa vie, quitte à affronter son propre destin. SF signée Rian Johnson.", actors:"Joseph Gordon-Levitt, Bruce Willis, Emily Blunt, Paul Dano, Noah Segan, Piper Perabo, Jeff Daniels"},
 {title:"Lord of War", year:2005, type:"DVD", cat:"action", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/94/63/18458444.jpg", youtube:"https://www.youtube.com/watch?v=9m5yRRJbT24", resume:"Yuri Orlov, fils d’immigrés ukrainiens, devient l’un des plus gros trafiquants d’armes de la planète. Des banlieues de New York aux dictatures africaines, il vend la mort en évitant l’agent d’Interpol Jack Valentine. Mais jusqu’où peut-on jouer avec la guerre sans y laisser son âme ?", actors:"Nicolas Cage, Jared Leto, Ethan Hawke, Bridget Moynahan, Eamonn Walker, Ian Holm, Donald Sutherland"},
{title:"Lucky Luke : La Ballade des Dalton", year:1978, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/00/02/51/70/aff.jpg", youtube:"https://youtu.be/oDGo9avirpw?is=uDxlO1n1-3Uiipvo", resume:"Les Dalton apprennent qu’ils héritent de leur oncle à condition d’abattre les 8 jurés qui l’ont condamné. Lucky Luke doit servir de témoin impartial à cette ballade meurtrière. Mais le cow-boy veille à ce que personne ne soit tué…", actors:"Daniel Ceccaldi, Jacques Balutin, Pierre Trabaud, Gérard Hernandez, Pierre Tornade, Bernard Haller, René Goscinny"},
{title:"L'Âge de Glace", year:2002, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/00/02/47/01/affiche.jpg", youtube:"https://youtu.be/e54fmsllNwg?feature=shared", resume:"Il y a 20 000 ans, alors que la banquise avance, un mammouth taciturne, un paresseux bavard et un tigre à dents de sabre en quête de rédemption forment un trio improbable pour ramener un bébé humain à sa tribu.", actors:"Voix VF : Gérard Lanvin, Bruno Salomone, Emmanuel Curtil"},
{title:"L'Âge de Glace 2", year:2006, type:"DVD", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/82/41/18603091.jpg", youtube:"https://youtu.be/47M5sClJNVI?is=IgNcZeFORmpw1HF8", resume:"La glace commence à fondre et le monde de Sid, Manny et Diego risque d'être englouti par une gigantesque inondation. La petite bande se lance dans une course pour rejoindre des terres plus sûres, tandis que Manny rencontre Ellie, une femelle mammouth persuadée d'être un opossum.", actors:"Voix VF : Gérard Lanvin, Bruno Salomone, Emmanuel Curtil, Anne Roumanoff"},
{title:"L'Âge de Glace 3 : Le Temps des dinosaures", year:2009, type:"DVD", cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/66/21/19/19099924.jpg", youtube:"https://youtu.be/Gnhl2Fax9i0?is=yW7D5gSDsxCpn2bM", resume:"Sid adopte trois œufs qui se révèlent être ceux d'un tyrannosaure, dont la mère furieuse vient les récupérer en l'entraînant dans un monde souterrain peuplé de dinosaures. Manny, Diego et Ellie partent à son secours et croisent la route de Buck, un belette intrépide.", actors:"Voix VF : Gérard Lanvin, Bruno Salomone, Emmanuel Curtil"},
{title:"L'Âge de Glace 4 : La Dérive des continents", year:2012, type:"DVD", cat:"comedie", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/86/68/30/20093574.jpg", youtube:"https://youtu.be/01g70mO-VrI?is=TVLTWwl44YTi8K8D", resume:"Un cataclysme fait éclater le continent en plusieurs morceaux, séparant Manny du reste de sa famille. À la dérive sur un iceberg, il doit affronter des pirates redoutables menés par le singe Capitaine Gutt pour retrouver les siens.", actors:"Voix VF : Gérard Lanvin, Bruno Salomone, Emmanuel Curtil"},
{title:"L'Apprenti sorcier", year:2010, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/73/75/50/19470603.jpg", youtube:"https://www.youtube.com/watch?v=N8r3-m2my9A", resume:"Balthazar Blake, sorcier millénaire à Manhattan, recrute Dave Stutler, étudiant en physique apparemment ordinaire, pour devenir son apprenti. Ensemble ils doivent stopper Maxim Horvath et sauver New York des forces des ténèbres.", actors:"Nicolas Cage, Jay Baruchel, Alfred Molina, Teresa Palmer, Monica Bellucci"},
{title:"L'Armée des douze singes", year:1995, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/23/11/08/10/59/2172302.jpg", youtube:"https://www.youtube.com/watch?v=ulSZPV4KK6k", resume:"En 2035, un prisonnier est envoyé en 1996 pour empêcher une épidémie mondiale qui a décimé 99% de la population. James Cole découvre une mystérieuse armée des 12 singes liée au virus.", actors:"Bruce Willis, Madeleine Stowe, Brad Pitt, Christopher Plummer"},
{title:"L'Entente cordiale", year:2006, type:"DVD", cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/36/29/13/18616967.jpg", youtube:"https://youtu.be/UxcifqwAzZ0?is=HNqUHS5A0yRD1k0d", resume:"François de La Conche, aristocrate psychorigide, reprend du service pour racheter une puce militaire volée par un ex-KGB. Il est flanqué de Jean-Pierre Moindrau, interprète séducteur et vulgaire. Le duo improbable part à Londres où la mission dérape en fiasco diplomatique.", actors:"Christian Clavier, Daniel Auteuil, Jennifer Saunders, François Levantal, Ivan Franek"},
{title:"L'été en pente douce", year:1987, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/23/07/10/09/09/4291155.jpg", youtube:"https://youtu.be/d9OZQPWgkGo?is=KAHBMM37ZXEl27R8", resume:"Fane en a assez d'entendre tous les soirs son voisin du dessus tabasser sa compagne. Un soir, il monte et redescend avec Lilas qu'il se met à aimer. Fane apprend alors la mort de sa mère qui avait une petite maison coincée entre deux garages. Fane, Lilas et Mo, le frère de Fane amoindri par une opération au cerveau, vont s'installer dans la maison. Ils vont essayer d'y être heureux malgré un village hostile et un été trop chaud. ", actors:"Jacques Villeret, Jean-Pierre Bacri, Pauline Lafont"},
{title:"L'Histoire sans fin", year:1984, type:"DVD", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/36/25/30/18465541.jpg", youtube:"https://youtu.be/xqdqX5RX7Wo?is=BiWO5_GztN24roaO", resume:"Bastien, 10 ans, vole un livre magique et plonge dans le monde de Fantasia. Pour sauver l’Impératrice mourante, le jeune guerrier Atreyu doit affronter le Néant qui dévore tout. Mais Bastien comprend qu’il est le seul à pouvoir sauver Fantasia en donnant un nouveau nom à l’Impératrice.", actors:"Barret Oliver, Noah Hathaway, Tami Stronach, Gerald McRaney, Moses Gunn, Alan Oppenheimer"},
{title:"L'Histoire sans fin 2 - Un nouveau chapitre", year:1984, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/66/66/12/19203054.jpg", youtube:"https://youtu.be/NAGAQMQ4ifs?is=vYmmOTdvAu0-u_WV", resume:"Bastien doit à nouveau surmonter des difficultés à l'école et dans ses rapports avec son père. Une fois de plus il cherche refuge et consolation dans l'Histoire sans fin, un livre précieusement conservé par l'antiquaire Coreander. Bastien est transporté au pays fantastique où il retrouve ses vieux amis et la petite impératrice. Mais il y a aussi les méchants, la cruelle sorcière et ses séïdes qui veulent détruire le monde de l'imagination.", actors:"Barret Oliver, Noah Hathaway, Tami Stronach, Gerald McRaney, Moses Gunn, Alan Oppenheimer"},
{title:"L'Ours", year:1988, type:"DVD", cat:"drame", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/22/09/19/16/27/4673488.jpg", youtube:"https://www.youtube.com/watch?v=RCNw83hY4oA", resume:"Un ourson orphelin, Youk, est recueilli par Kaar, un grand ours solitaire. Ensemble ils doivent échapper à deux chasseurs, Tom et Bill. Raconté du point de vue des animaux, un film sans dialogues sur la survie et l’amitié sauvage.", actors:"Bart the Bear, Youk the Bear, Tchéky Karyo, Jack Wallace, André Lacombe"},
{title:"Maman, j'ai raté l'avion", year:1990, type:"DVD", cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/17/11/15/15/14/4627669.jpg", youtube:"https://www.youtube.com/watch?v=GPtHAQARLdw", resume:"La famille McCallister part à Paris pour Noël et oublie Kevin, 8 ans, à la maison. D’abord ravi d’être seul, il doit défendre la maison contre Harry et Marv, deux cambrioleurs poissards, avec des pièges délirants.", actors:"Macaulay Culkin, Joe Pesci, Daniel Stern, Catherine O'Hara, John Heard"},
{title:"Maman, j'ai encore raté l'avion", year:1992, type:"DVD", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/19/01/16/13/47/0129993.jpg", youtube:"https://youtu.be/9-1_k2BLhmY?is=oK9vHYO16B1KfkhL", resume:"La famille McCallister s'apprête à passer ses vacances de Noël à Miami. À l'aéroport, Kevin se trompe d'avion et embarque pour New York. Grâce à la carte de crédit de son père, il visite la ville et séjourne au luxueux Plaza Hotel. Il tombe par hasard sur Harry et Marvin, évadés de prison, qui projettent de braquer un magasin de jouets.", actors:"Macaulay Culkin, Joe Pesci, Daniel Stern"},
{title:"Mary à tout prix", year:1998, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/23/11/14/14/11/3909229.jpg", imdb:"https://www.imdb.com/title/tt0129387/", youtube:"https://youtu.be/TFcVBeZiB4U?feature=shared", resume:"Epris de la ravissante Mary, Ted, lycéen empoté et boutonneux, ne sait comment la séduire. Un soir, il tente sa chance à l'occasion d'un bal, mais ses maladresses le conduisent tout droit à l'hôpital. Le lendemain, la belle a déménagé. Treize ans plus tard, son souvenir continue de hanter Ted...", actors:"Ben Stiller, Cameron Diaz, Matt Dillon"},
{title:"Master and Commander : De l'autre côté du monde", year:2003, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/35/15/63/18364956.jpg", imdb:"https://www.imdb.com/title/tt0311113/", youtube:"https://youtu.be/rpgC5IbQ_M4?is=Hnkz59Uw33NITRPl", resume:"En 1805, le capitaine Jack Aubrey est une des figures les plus brillantes de la Marine Royale britannique. Attaqué par le navire français Achéron, le Surprise est gravement endommagé. Sourd aux conseils de prudence du chirurgien, Jack se lance à la poursuite de l'ennemi. Du Brésil aux Galápagos, sa quête tourne à l'obsession...", actors:"Russell Crowe, Paul Bettany, James D'Arcy"},
{title:"Matrix", year:1999, type:"Blu-ray", cat:"sf", img:"https://image.tmdb.org/t/p/w300/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg", imdb:"https://www.imdb.com/title/tt0133093/", youtube:"https://youtu.be/8xx91zoASLY?is=TWdkAebLkHrYMpjO", resume:"Thomas Anderson, programmeur sans histoire le jour, devient Neo la nuit, un pirate recherché du cyberespace. Entre deux mondes, Neo reçoit des messages cryptés d’un individu nommé Morpheus. Celui-ci l’incite à dépasser les apparences et percer le mystère de la Matrice.", actors:"Keanu Reeves, Laurence Fishburne, Carrie-Anne Moss"},
{title:"Matrix Reloaded", year:2003, type:"Blu-ray", cat:"sf", img:"https://image.tmdb.org/t/p/w300/9TGHDvWrqKBzwDxDodHYXEmOE6J.jpg", imdb:"https://www.imdb.com/title/tt0234215/", youtube:"https://youtu.be/0ha2XYVC7_s?is=oqSjU_sZqGICvvYz", resume:"Neo apprend à mieux contrôler ses dons naturels, alors même que Sion s'apprête à tomber sous l'assaut de l'Armée des Machines. D'ici quelques heures, 250 000 Sentinelles programmées pour anéantir notre espèce envahiront la dernière enclave humaine. Mais Morpheus galvanise les citoyens de Sion en leur rappelant la Parole de l'Oracle : il est encore temps pour l'Elu d'arrêter la guerre.", actors:"Keanu Reeves, Laurence Fishburne, Carrie-Anne Moss"},
{title:"Matrix Revolutions", year:2003, type:"Blu-ray", cat:"sf", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/14/64/18364977.jpg", imdb:"https://www.imdb.com/title/tt0242653/", youtube:"https://youtu.be/sK51m1tj_bE?is=4Rw4P1sUtA6efDtD", resume:"La longue quête de liberté des rebelles culmine en une bataille finale explosive. Tandis que l'armée des Machines sème la désolation sur Zion, ses citoyens organisent une défense acharnée. Neo s’aventure en Terre Interdite pour une ultime confrontation avec l’Agent Smith.", actors:"Keanu Reeves, Laurence Fishburne, Carrie-Anne Moss"},
{title:"Matrix Resurrections", year:2021, type:"Blu-ray", cat:"sf", img:"https://image.tmdb.org/t/p/w300/8c4a8kE7PizaGQQnditMmI1xbRp.jpg", imdb:"https://www.imdb.com/title/tt10838180/", youtube:"https://youtu.be/Tj63xbpKnqo?is=1Tg_gt_wGTNoT_dm", resume:"Neo vit une vie ordinaire à San Francisco. Il est hanté par des rêves étranges et prend des pilules bleues prescrites par son thérapeute. Mais quand un homme se présentant comme Morpheus lui offre la pilule rouge, son esprit rouvre à la Matrice.", actors:"Keanu Reeves, Carrie-Anne Moss, Yahya Abdul-Mateen II"},
{title:"Merci mon chien", year:1999, type:"DVD", cat:"comedie", img:"https://www.cine974.com/images/affiches/grand/merci-mon-chien-6gr5B6In.jpg", imdb:"https://www.imdb.com/title/tt0227207/", youtube:"https://youtu.be/kUA7Or99MUc?is=LW3vAU52imaP-Eu1", resume:"Amir, Pakistanais, travaille depuis six ans sans papiers dans le quartier du sentier. Jo, son patron, commerçant prospère, lui promet sans cesse de régulariser sa situation. Apeuré par les lois qui répriment le travail clandestin, Jo finit par échanger Amir contre une dette de jeu à son collègue Ralph, très mauvais homme d'affaires qui rate tout ce qu'il entreprend. Pourtant, un an plus tard, les affaires de Ralph sont prospères tandis que Jo ne connait que des revers. Aucun des deux ne peut imaginer qu'ils doivent le succès a leur homme a tout faire, pakistanais de surcroit!", actors:"Jean Yanne, Rufus"},
{title:"Mesrine : L'Instinct de mort", year:2008, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/64/18/78/18990267.jpg", youtube:"https://youtu.be/2FIx161gnH0?is=iw3IRHbnibSDbKmZ", resume:"Des années 60 à Paris au début des années 70 au Canada, le parcours criminel hors norme de Jacques Mesrine. De la guerre d’Algérie à son retour en France, il plonge dans la violence et devient un gangster redouté.", actors:"Vincent Cassel, Cécile de France, Gérard Depardieu"},
{title:"Mesrine : L'Ennemi public n°1", year:2008, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/64/53/39/19007981.jpg", youtube:"https://youtu.be/y7gIy4H-nU0?is=EtDhIbB0lq7o9yZL", resume:"Les années 70. Jacques Mesrine, proclamé ennemi public n°1, multiplie les braquages, les évasions spectaculaires et les interviews. Traqué par toutes les polices, il finira abattu porte de Clignancourt le 2 novembre 1979.", actors:"Vincent Cassel, Ludivine Sagnier, Mathieu Amalric"},
{title:"Moi, moche et méchant", year:2010, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/73/23/03/19494202.jpg", youtube:"https://youtu.be/OPf1YYSKxBs?feature=shared", resume:"Gru, super-vilain sur le déclin, prévoit le casse du siècle : voler la Lune. Pour mener à bien son plan, il adopte trois orphelines qui vont bouleverser ses plans et son cœur de pierre, sans même s'en rendre compte.", actors:"Voix VF : Gad Elmaleh, Emma de Caunes"},
{title:"Moi, moche et méchant 2", year:2013, type:"DVD", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/89/40/05/20532087.jpg", youtube:"https://youtu.be/ewvQa7bH5Ws?feature=shared", resume:"Gru, désormais père de famille rangé, est recruté par l'Agence Anti-Vilains pour identifier le responsable du vol d'un laboratoire secret. Il fait équipe avec Lucy, une agente pleine d'entrain, tandis que ses Minions se comportent de manière étrange.", actors:"Voix VF : Gad Elmaleh, Karin Viard"},
{title:"Monsieur Batignolle", year:2002, type:"DVD", cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/41/39/aff.jpg", youtube:"https://youtu.be/hax5OtbwEBE?feature=shared", resume:"Paris, 1942. Edmond Batignolle, boucher sans histoire, accepte de dénoncer un jeune juif pour épouser sa fille à son propre fils. Rongé par la culpabilité, il finit par recueillir Simon, un adolescent juif en fuite, et bascule peu à peu dans la Résistance.", actors:"Gérard Jugnot, Jules Sitruk, Michèle Garcia"},
{title:"Monsieur Peabody et Sherman", year:2014, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/13/12/23/16/46/254085.jpg", youtube:"https://www.youtube.com/results?search_query=Monsieur+Peabody+et+Sherman+bande+annonce+vf", resume:"Monsieur Peabody, chien surdoué inventeur de la machine à voyager dans le temps, éduque son fils adoptif Sherman, un petit garçon. Ensemble, ils sillonnent l'Histoire, mais un voyage imprudent menace de bouleverser l'espace-temps tout entier.", actors:"Voix VF : Louis-Do de Lencquesaing"},
{title:"Mr. & Mrs. Smith", year:2005, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/50/84/18432356.jpg",  youtube:"https://youtu.be/Qid0DDlISO8?is=B4Lvn_iIYhPN5slA", resume:"John et Jane Smith forment un couple très moderne et pourtant très banal. Ce qu’ils ignorent l’un de l’autre : ils sont tous deux tueurs à gages pour des organisations rivales. Le jour où leurs agences les chargent de s’éliminer mutuellement, leur vie bascule.", actors:"Brad Pitt, Angelina Jolie, Vince Vaughn"},
{title:"Napoléon", year:2002, type:"DVD", cat:"drame", img:"https://projetcartylion.fr/wp-content/uploads/2024/02/Napoleon-serie-Clavier.jpg", youtube:"https://youtu.be/Q6pKjRMPo6k?is=OysguR7htSaSRYgF", resume:"Mini-série retraçant l’ascension et la chute de Napoléon Bonaparte, de son arrivée au pouvoir à son exil à Sainte-Hélène.", actors:"Christian Clavier, Isabella Rossellini, Gérard Depardieu"},
