<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
  color:#111;
}

header{
  position:sticky;
  top:0;
  background:#000;
  padding:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  z-index:10;
  color:white;
}

header h2 {
  margin:0 10px 0 0;
}

#compteur{
  background:#032541;
  padding:6px 12px;
  border-radius:6px;
  font-size:13px;
  margin-left:auto;
  white-space:nowrap;
}

#filterType, #filterCat, #filterDecennie {
  width: 90px!important;
  min-width: 90px!important;
  max-width: 90px!important;
  flex: 0 0 90px!important;
  padding: 10px 4px!important;
  font-size: 12px!important;
  text-overflow: ellipsis!important;
  overflow: hidden!important;
  white-space: nowrap!important;
  -webkit-appearance: none!important;
  appearance: none!important;
  background: white url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 4px center!important;
  background-size: 12px!important;
}

input, select, button{
  padding:10px;
  border:none;
  border-radius:6px;
  font-size:14px;
}

button{
  background:#e50914;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#f40612;
}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap:10px;
  padding:15px;
}

.card{
  background:#1c1c1c;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.2s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.info{
  padding:10px;
  color:white;
}

.title{
  font-weight:bold;
  margin-bottom:4px;
}

.small{
  font-size:12px;
  color:#aaa;
  margin-top:3px;
}

/* POPUP FICHE FILM STYLE TMDB */
.popup-film{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  z-index:100;
  overflow-y:auto;
}

.film-header{
  position:relative;
  background:#032541;
  color:white;
  padding:30px 20px;
  display:flex;
  gap:30px;
  flex-wrap:wrap;
}

.film-poster{
  width:300px;
  border-radius:10px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.film-details{
  flex:1;
  min-width:300px;
}

.film-details h1{
  margin:0;
  font-size:2.2em;
}

.film-details .year{
  opacity:0.8;
  font-weight:300;
}

.film-meta{
  margin:15px 0;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  align-items:center;
}

.film-meta .tag{
  background:rgba(255,255,255,0.1);
  padding:4px 10px;
  border-radius:4px;
  font-size:14px;
}

.film-actions{
  display:flex;
  gap:15px;
  margin:20px 0;
  flex-wrap:wrap;
}

.film-actions button{
  display:flex;
  align-items:center;
  gap:8px;
  background:#032541;
  border:2px solid white;
}

.film-actions button:hover{
  background:white;
  color:#032541;
}

.film-synopsis h3{
  margin:20px 0 10px 0;
  font-size:1.3em;
}

.film-synopsis p{
  line-height:1.6;
  opacity:0.9;
}

.close-film{
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  border:none;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

/* POPUP A ACHETER - VERSION PAGE */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0f0f0f;
  display:none;
  flex-direction:column;
  z-index:90;
  overflow-y:auto;
}

.popup-acheter-header{
  position:sticky;
  top:0;
  background:#000;
  padding:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  z-index:5;
  border-bottom:2px solid #e50914;
}

.popup-acheter-header h2{
  margin:0;
  color:white;
  flex:1;
}

#compteurAcheter{
  background:#e50914;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  color:white;
}

#searchAcheter{
  padding:10px 15px;
  width:220px;
  background:#222;
  color:white;
  border:1px solid #444;
  border-radius:6px;
}

.popup-acheter-content{
  padding:15px;
  flex:1;
}

.grid-acheter{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap:12px;
}

.card-acheter{
  background:#1c1c1c;
  border-radius:10px;
  overflow:hidden;
  border-left:3px solid #e50914;
  padding:12px;
  color:white;
}

.card-acheter .title{
  font-weight:bold;
  font-size:14px;
}

.card-acheter .small{
  font-size:11px;
  color:#aaa;
  margin-top:4px;
}
/* TABLETTES 601-900px : 6 colonnes */
@media (min-width: 601px) and (max-width: 900px){
.grid{
    grid-template-columns: repeat(6, 1fr);
    gap:8px;
  }
.card img{
    height:200px;
  }
}

/* TELEPHONES < 600px : 5 colonnes */
@media (max-width: 600px){
.grid{
    grid-template-columns: repeat(5, 1fr);
    gap:6px;
    padding:10px;
  }
.card img{
    height:106px;
  }
.info{
    display:none;
  }
.film-header{
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
.film-poster{
    width:200px;
  }
  #compteur{
    margin-left:0;
    order:10;
    width:100%;
    text-align:center;
  }
}
.popup-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}

.popup-video-box{
  width:90%;
  max-width:900px;
  position:relative;
}

.popup-video iframe{
  width:100%;
  height:50vh;
  border:none;
  border-radius:10px;
}

.close-video{
  position:absolute;
  top:-40px;
  right:0;
  background:#e50914;
  border:none;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

@media (max-width: 600px){
.popup-video iframe{
    height:30vh;
  }
}

</style>

const FILMS_DEFAUT = [


{title:"7 ans de mariage", year:2003, type:"DVD", lienVideo:"https://ok.ru/videoembed/7839258118673" , cat:"comedie", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/35/09/93/affiche.jpg", youtube:"https://youtu.be/yJxAOxbMUvQ?is=foQu9z9iTg7S4-qZ", resume:"Jean, marié depuis sept ans, s'ennuie profondément dans son couple. Lors d'un mariage, il retrouve son ex, Alice, et replonge dans une liaison passionnée. Entre remords, désir et habitudes conjugales, la comédie observe avec ironie le fameux 'cap des sept ans'.", actors:"Vincent Elbaz, Alexandra Vandernoot, Sylvie Testud"},
  {title:"2012", year:2009, type:"Blu-ray", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/68/10/09/19186143.jpg", youtube:"https://youtu.be/m33rzUxflto", resume:"Les Mayas, l'une des plus fascinantes civilisations que la Terre ait portées, nous ont transmis une prophétie : leur calendrier prend fin en 2012, et notre monde aussi. Depuis, les astrologues l'ont confirmé, les numérologues l'ont prédit, les géophysiciens trouvent cela dangereusement plausible, et même les experts scientifiques gouvernementaux finissent par arriver à cette terrifiante conclusion. La prophétie maya a été examinée, discutée, minutieusement analysée. En 2012, nous saurons tous si elle est vraie, mais quelques-uns auront été prévenus depuis longtemps… Lorsque les plaques tectoniques se mettent à glisser, provoquant de multiples séismes et détruisant Los Angeles au passage, Jackson Curtis, romancier, et sa famille se jettent à corps perdu, comme des millions d'individus, dans un voyage désespéré. Tous ne pourront pas être sauvés…", actors:"John Cusack, Amanda Peet, Chiwetel Ejiofor"},
  {title:"300", year:2006, type:"Blu-ray", cat:"peplum", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/36/26/41/18737112.jpg", youtube:"https://share.google/Bg1z5U7eE5r26G2YF", resume:"Adapté du roman graphique de Frank Miller, 300 est un récit épique de la Bataille des Thermopyles, qui opposa en l'an - 480 le roi Léonidas et 300 soldats spartiates à Xerxès et l'immense armée perse. Face à un invincible ennemi, les 300 déployèrent jusqu'à leur dernier souffle un courage surhumain ; leur vaillance et leur héroïque sacrifice inspirèrent toute la Grèce à se dresser contre la Perse, posant ainsi les premières pierres de la démocratie.", actors:"Gerard Butler, Lena Headey, David Wenham, Dominic West, Rodrigo Santoro, Michael Fassbender"},
{title:"Le Sixième Sens", year:1999, type:"DVD", lienVideo:"https://ok.ru/videoembed/42169535051" ,  cat:"drame", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/66/15/77/19255607.jpg", youtube:"https://youtu.be/jiRpbXLwu5c", resume:"Cole Sear, garconnet de huit ans est hanté par un terrible secret. Son imaginaire est visité par des esprits menaçants. Trop jeune pour comprendre le pourquoi de ces apparitions et traumatisé par ces pouvoirs paranormaux, Cole s'enferme dans une peur maladive et ne veut reveler à personne la cause de son enfermement, à l'exception d'un psychologue pour enfants. La recherche d'une explication rationnelle guidera l'enfant et le thérapeute vers une vérité foudroyante et inexplicable.", actors:"Bruce Willis, Haley Joel Osment, Toni Collette, Olivia Williams"},
{title:"Abraham Lincoln, chasseur de vampires", year:2012, type:"Blu-ray 3D", lienVideo:"https://ok.ru/videoembed/41394702963" ,cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/89/23/12/20161166.jpg", youtube:"https://youtu.be/FKyaGddWwj4", resume:"Lorsqu'Abraham Lincoln découvre que des vampires assoiffés de sang se préparent à envahir le pays, il jure de les éliminer les uns après les autres, à coups de hache. C'est alors que se révèle un chasseur hors pair, menant une guerre secrète sans précédent, avant même de devenir l'illustre figure de la guerre de Sécession.", actors:"Benjamin Walker, Mary Elizabeth Winstead, Rufus Sewell, Dominic Cooper"},
  {title:"Ah! si j'étais riche", year:2002, type:"DVD", lienVideo:"https://ok.ru/videoembed/3341623233199" , cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/00/02/54/75/affiche.jpg", youtube:"https://youtu.be/zbxxFR1KqAE?is=M0DN1oErXpTjx1ay", resume:"Entre sa femme qui engage une procédure de divorce, les dettes qui s'accumulent et un emploi menacé, Aldo Bonnard voit sa vie se déliter, jusqu'au jour où il gagne une fortune au loto. Alors qu'il est sur le point d'annoncer la nouvelle à son épouse, il découvre qu'elle le trompe avec son nouveau patron. Deux solutions se présentent alors à lui : soit partager ses gains faramineux avec elle et... son rival, soit dissimuler sa fortune et feindre avoir gagné après le divorce. Il choisit cette dernière option, mais vit parallèlement et clandestinement comme un homme richissime.", actors:"Jean-Pierre Darroussin, Valeria Bruni Tedeschi, Richard Berry, François Morel"},
 {title:"Alexandre", year:2004, type:"DVD", cat:"peplum", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/23/58/18398340.jpg", youtube:"https://share.google/C4nnI4jktq3Q4lXwa", resume:"La vie d'Alexandre le Grand, narrée par Ptolémée : de son enfance à sa mort, des cours d'Aristote aux conquêtes qui firent sa légende, de l'intimité aux champs de bataille. Fils du roi Philippe II, il soumit la Grèce révoltée, fonda Alexandrie, défit les Perses, s'empara de Babylone et atteint l'Indus pour établir à 32 ans l'un des plus grands empires ayant jamais existé.", actors:"Colin Farrell, Angelina Jolie, Val Kilmer, Jared Leto, Anthony Hopkins"},
{title:"Alerte !", year:1995, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/36/09/76/19161301.jpg", youtube:"https://youtu.be/rylUZoB_kUw?is=Tax1ZkJgwGSIlTYt", resume:"Un virus mortel venu d'Afrique se propage dans une petite ville américaine. Le colonel Sam Daniels, virologue de l'armée, se lance dans une course contre la montre pour trouver un remède avant que l'armée ne décide de raser la ville pour endiguer l'épidémie.", actors:"Dustin Hoffman, Rene Russo, Morgan Freeman, Kevin Spacey, Cuba Gooding Jr."},
{title:"Angry Birds, le film", year:2016, type:"Blu-ray", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/16/04/13/15/16/128988.jpg", youtube:"https://share.google/P7PWjb1Jogyoyvy1S", resume:"Ce film nous amène sur une île entièrement peuplée d’oiseaux heureux et qui ne volent pas – ou presque. Dans ce paradis, Red, un oiseau avec un problème de colère, le très pressé Chuck, et l’imprévisible Bomb ont toujours été mis à l’écart. Mais lorsqu’arrivent des cochons verts mystérieux sur l’île, ce sera la mission de ce groupe de parias de découvrir ce que trament les cochons.", actors:"Omar Sy, Audrey Lamy, Jason Sudeikis, Josh Gad, Danny McBride"},
{title:"Ant-Man", year:2015, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/15/05/06/16/05/305731.jpg", youtube:"https://share.google/KWq1xequmy2rfU0eA", resume:"Scott Lang, cambrioleur de haut vol, va devoir apprendre à se comporter en héros et aider son mentor, le Dr Hank Pym, à protéger le secret de son spectaculaire costume d’Ant-Man, afin d’affronter une effroyable menace…", actors:"Paul Rudd, Michael Douglas, Evangeline Lilly, Corey Stoll, Bobby Cannavale"},
{title:"American Pie 3 : Marions-les !", year:2003, type:"DVD", lienVideo:"https://ok.ru/videoembed/9907223267891" ,cat:"comedie", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/15/01/18364355.jpg", youtube:"https://youtu.be/6BfFkalaqAk?is=oVLSmZj3MQ8tpYmG", resume:"Jim et Michelle vont enfin se marier, mais leur mariage 'parfait' est menacé par l'arrivée de Stifler, bien décidé à mettre son grain de sel dans l'organisation. Entre beaux-parents coincés et rivalité amoureuse pour séduire la demoiselle d'honneur, l'enterrement de vie de garçon va tourner au chaos.", actors:"Jason Biggs, Alyson Hannigan, Seann William Scott"},
{title:"Aquaman", year:2018, type:"Blu-ray", cat:"sf", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/18/12/13/12/12/2738771.jpg", youtube:"https://www.youtube.com/watch?v=pFI7ovOfY9Y", resume:"Arthur Curry, mi-humain mi-atlante, découvre qu'il est destiné à devenir le roi des Sept Mers. Pour empêcher son demi-frère Orm d'unir les royaumes sous-marins et de déclarer la guerre à la surface, il doit accepter son héritage et revendiquer le trône d'Atlantide.", actors:"Jason Momoa, Amber Heard, Willem Dafoe, Patrick Wilson"},
 {title:"Arrête-moi si tu peux", year:2002, type:"DVD", lienVideo:"https://ok.ru/videoembed/7544706370065" ,cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/00/02/54/32/aff2.jpg", youtube:"https://share.google/QYLPNEAV4cCSvXDwS", resume:"Dans les années soixante, le jeune Frank Abagnale Jr. est passé maître dans l'art de l'escroquerie, allant jusqu'à détourner 2,5 millions de dollars et à figurer sur les listes du FBI comme l'un des dix individus les plus recherchés des Etats-Unis. Véritable caméléon, Frank revêt des identités aussi diverses que celles de pilote de ligne, de médecin, de professeur d'université ou encore d'assistant du procureur. Carl Hanratty, agent du FBI à l'apparence stricte, fait de la traque de Frank Abagnale Jr. sa mission prioritaire, mais ce dernier reste pendant longtemps insaisissable...", actors:"Leonardo DiCaprio, Tom Hanks, Christopher Walken, Amy Adams, Nathalie Baye"},
{title:"Assassins", year:1995, type:"DVD", lienVideo:"https://ok.ru/videoembed/10450116807185" , cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/65/04/25/19721070.jpg", youtube:"https://youtu.be/8UK8FRU5kPY", resume:"Robert Rath est le meilleur tueur à gages de sa profession. Alors qu'il est sur le point de se retirer discrètement, un autre tueur jeune et plein de fougue nommé Miguel Bain tue un « client » à sa place, et décide bientôt de s'en prendre à Rath lui-même. Celui-ci s'allie à Electra, une pirate informatique, qui était une cible de Rath, afin de contrer les plans de Bain et de leur employeur commun.", actors:"Sylvester Stallone, Antonio Banderas, Julianne Moore"},
{title:"Astérix - Le Secret de la potion magique", year:2018, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/23/12/12/16/57/3092330.jpg", youtube:"https://youtu.be/gXbR3zonMRk", resume:"À la suite d’une chute lors de la cueillette du gui, le druide Panoramix décide qu’il est temps d’assurer l’avenir du village. Accompagné d’Astérix et Obélix, il entreprend de parcourir le monde gaulois à la recherche d’un jeune druide talentueux à qui transmettre le Secret de la Potion Magique…", actors:"Christian Clavier, Guillaume Briat, Alex Lutz, Alexandre Astier, Elie Semoun"},
  {title:"Astérix et Obélix contre César", year:1999, type:"DVD", lienVideo:"https://ok.ru/videoembed/9716618562104" , cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/03/66/76/036676_af.jpg", youtube:"https://youtu.be/teVUv9EXqII?is=2i0_eXHaKr-YhQO3", resume:"La Gaule en l'an 50 avant Jésus-Christ, est occupée par les Romains. Un seul village résiste, grâce à la potion magique préparée par le druide Panoramix. Au moment où César se prépare à envahir l'Angleterre, il apprend que ce village tient en échec ses troupes et refuse de payer l'impôt. Détritus, gouverneur de la région, est chargé de mater les rebelles…", actors:"Christian Clavier, Gérard Depardieu, Roberto Benigni, Michel Galabru, Laetitia Casta"},
  {title:"Astérix et Obélix : Au service de Sa Majesté", year:2012, type:"Blu-ray", lienVideo:"https://ok.ru/videoembed/7905851607701" , cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/89/32/13/20231929.jpg", youtube:"https://youtu.be/eLr8aU-sTb8", resume:"50 avant Jésus-Christ. César a soif de conquêtes. À la tête de ses glorieuses légions il décide d'envahir cette île située aux limites du monde connu, ce pays mystérieux appelé Brittania, la Bretagne. La victoire est rapide et totale. Enfin... presque. Un petit village breton parvient à lui résister, mais ses forces faiblissent. Cordelia, la reine des Bretons, décide donc d'envoyer son plus fidèle officier, Jolitorax, chercher de l'aide en Gaule, auprès d'un autre petit village, connu pour son opiniâtre résistance aux Romains...", actors:"Édouard Baer, Gérard Depardieu, Guillaume Gallienne, Vincent Lacoste, Valérie Lemercier, Fabrice Luchini, Catherine Deneuve"},
{title:"Astérix et Obélix : L'Empire du Milieu", year:2023, type:"Blu-ray", lienVideo:"https://ok.ru/videoembed/13163569285649" , cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/23/01/03/15/53/0336388.jpg", youtube:"https://youtu.be/L7Lm7tr14xw", resume:"Nous sommes en 50 avant J.C. L’Impératrice de Chine est emprisonnée suite à un coup d’état fomenté par Deng Tsin Quin, un prince félon. Aidée par Graindemaïs, le marchand phénicien, et par sa fidèle guerrière Tat Han, la princesse Fu-Yi, fille unique de l’impératrice, s’enfuit en Gaule pour demander de l’aide aux deux valeureux guerriers Astérix et Obélix, dotés d’une force surhumaine grâce à leur potion magique. Nos deux inséparables Gaulois acceptent bien sûr de venir en aide à la Princesse pour sauver sa mère et libérer son pays. Et les voici tous en route pour une grande aventure vers la Chine.", actors:"Guillaume Canet, Gilles Lellouche, Vincent Cassel, Jonathan Cohen, Marion Cotillard, Julie Chen, Leanna Chea"},
{title:"Astérix : Le Domaine des dieux", year:2014, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/23/12/12/16/56/3491830.jpg", youtube:"https://youtu.be/1xRNY_9nb8o?is=D4u7a0dQ0ikasr_d", resume:"Jules César lance un projet immobilier gigantesque autour du village gaulois pour isoler et assimiler les irréductibles Gaulois par la 'civilisation' romaine. Astérix et Obélix doivent empêcher la construction de ce complexe résidentiel qui menace leur mode de vie.", actors:"Roger Carel, Lorànt Deutsch, Michel Galabru (voix)"},
{title:"Astérix et Obélix : Mission Cléopâtre", year:2002, type:"DVD", lienVideo:"https://ok.ru/videoembed/13163557292561" ,cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/23/06/21/12/06/4953335.jpg", youtube:"https://youtu.be/7Nd1ZCwB5PI?is=zapMzaSXJJ5JaBqM", resume:"Cléopâtre, la reine d’Égypte, décide, pour défier l'Empereur romain Jules César, de construire en trois mois un palais somptueux en plein désert. Si elle y parvient, celui-ci devra concéder publiquement que le peuple égyptien est le plus grand de tous les peuples. Pour ce faire, Cléopâtre fait appel à Numérobis, un architecte d'avant-garde plein d'énergie. S'il réussit, elle le couvrira d'or. S'il échoue, elle le jettera aux crocodiles. Celui-ci, conscient du défi à relever, cherche de l'aide auprès de son vieil ami Panoramix. Le druide fait le voyage en Égypte avec Astérix et Obélix.", actors:"Gérard Depardieu, Christian Clavier, Jamel Debbouze, Monica Bellucci, Alain Chabat, Gérard Darmon, Claude Rich, Édouard Baer"},
  {title:"A Star Is Born", year:2018, type:"Blu-ray", cat:"drame", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/19/04/05/16/00/1578857.jpg", youtube:"https://youtu.be/jsg9NxCBzFs?is=5ktyxKiHSZmNjSDg", resume:"Star de country un peu oubliée, Jackson Maine découvre Ally, une jeune chanteuse très prometteuse. Tandis qu'ils tombent follement amoureux l'un de l'autre, Jack propulse Ally sur le devant de la scène et fait d'elle une artiste adulée par le public. Bientôt éclipsé par le succès de la jeune femme, il vit de plus en plus mal son propre déclin…", actors:"Bradley Cooper, Lady Gaga, Sam Elliott, Andrew Dice Clay, Rafi Gavron, Dave Chappelle"},
  {title:"Avatar", year:2009, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/22/08/25/09/04/2146702.jpg", youtube:"https://youtu.be/60ArLSCgjSU?is=WWE9iBLDVBc29x1l", resume:"Sur la lointaine planète de Pandora, Jake Sully, un ancien marine paraplégique, est envoyé en mission par la RDA, un consortium minier. Grâce à un avatar, un corps biologique Na'vi contrôlé à distance, il s'infiltre chez les Na'vi pour négocier le déplacement du clan Omaticaya. Mais Jake tombe amoureux de Neytiri, une Na'vi, et de Pandora. Il finit par choisir de défendre ce monde face aux humains prêts à tout détruire pour exploiter l'unobtanium.", actors:"Sam Worthington, Zoe Saldana, Sigourney Weaver, Stephen Lang, Michelle Rodriguez, Giovanni Ribisi"},
  {title:"Bandits : Gentlemen braqueurs", year:2001, type:"DVD", lienVideo:"https://ok.ru/videoembed/9288794573463" , cat:"action", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/00/02/33/31/bandits.jpg", youtube:"https://youtu.be/LVZJiA5Wv3U?is=n6aRbwQRcstGpr8U", resume:"Évadés de prison, Joe Blake et Terry Collins décident de se faire la belle vie en braquant les banques. Ils le font cependant en suivant un certain code d'honneur. Ils vont de ville en ville, employant une méthode bien au point : kidnapper le directeur d'une banque le soir, en soupant et en passant la nuit chez lui et se rendre à la banque au matin pour voler l'argent. Survient Kate, qui n'est pas comme les autres femmes… et qui bouleverse l'unité de leur équipe.", actors:"Bruce Willis, Billy Bob Thornton, Cate Blanchett, Troy Garity, January Jones"},
 {title:"Blanche-Neige et les sept nains", year:1937, type:"DVD", lienVideo:"https://ok.ru/videoembed/7120987163371" , cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/60/04/90/19681823.jpg", youtube:"https://youtu.be/eyjc8txuG44?feature=shared", resume:"Blanche-Neige est une princesse d’une très grande beauté, ce qui rend jalouse sa belle‐mère. Celle‐ci demande quotidiennement à son miroir magique de lui dire qu’elle est la plus belle, mais un jour, le miroir affirme que la plus belle femme du royaume est Blanche-Neige. La reine décide alors de la tuer, mais le garde chargé de cette tâche ne trouve pas le courage et abandonne Blanche-Neige dans la forêt. Perdue, à bout de force, elle échoue dans une maison où habitent sept nains.", actors:"Adriana Caselotti, Lucille La Verne, Roy Atwell, Pinto Colvig, Otis Harlan, Scotty Mattraw"},
 {title:"Boys and Girls", year:2000, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/00/02/29/15/69199422_af.jpg", youtube:"https://youtu.be/FBIYE656wr0?is=wD7AR_QqDl8YhtCD", resume:"Ryan, un jeune homme coincé et exigeant, et Jennifer, une jeune fille romantique et pleine d'énergie, sont deux étudiants à Berkeley qui ne s'apprécient définitivement pas. Du moins, c'est l'impression qu'ils ont toujours eue. A douze ans, leur rencontre fut un véritable désastre. A l'adolescence, ils se détestaient plus que jamais. Mais une fois à l'université, ils s'aperçoivent que leurs différences les ont rapprochés. Une amitié voit le jour entre eux. Mais dans la vie, le mélange des genres ne fait pas toujours bon ménage.", actors:"Freddie Prinze Jr., Claire Forlani, Jason Biggs, Amanda Detmer, Alyson Hannigan"},
  {title:"Braveheart", year:1995, type:"DVD", lienVideo:"https://ok.ru/videoembed/7658205940241" , cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/73/51/89/19209164.jpg", youtube:"https://youtu.be/Z0M1FjLntQg?is=9TGe_56Tm9bMdZlm", resume:"À la fin du XIIIe siècle, l'Écosse subit la domination du roi d'Angleterre Édouard Ier. Lorsque sa femme Murron est exécutée par les Anglais, William Wallace prend la tête d'une révolte paysanne pour libérer son pays. Devenu le symbole de la résistance écossaise, il mènera ses compatriotes au combat pour reconquérir leur liberté.", actors:"Mel Gibson, Sophie Marceau, Patrick McGoohan, Angus Macfadyen, Brendan Gleeson, Catherine McCormack"},
 {title:"Cars", year:2006, type:"Blu-ray", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/17/08/01/16/24/309645.jpg", youtube:"https://youtu.be/jSMYl18wkpk?feature=shared", resume:"Flash McQueen, jeune voiture de course arrogante promise au succès, se retrouve par hasard perdu dans la petite ville de Radiator Springs, sur la Route 66. Loin des vivas de ses fans, il va alors découvrir des habitants passionnants – la splendide Sally, le sage Doc Hudson ou l'hilarant Martin – qui vont l'aider à apprendre que dans la vie il y a des choses bien plus importantes que les trophées et la gloire.", actors:"Owen Wilson, Paul Newman, Bonnie Hunt, Larry the Cable Guy, Cheech Marin, Tony Shalhoub"},
 {title:"Camping", year:2006, type:"DVD", lienVideo:"https://ok.ru/videoembed/12466977573399" , cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/36/09/10/18603110.jpg", youtube:"  https://youtu.be/JAKzzI1XAsM?is=5jdFJH_MrDCEr_uo  ", resume:"1er août. Comme tous les ans, le Camping des Flots Bleus accueille les vacanciers. Retrouvailles, barbecues, tongs, Ricard et Shogun... C'est beau la vie ! Pourtant cette année, rien ne va plus. Patrick Chirac attend toujours sa femme, les Gatineau font tente à part, les Pic n'ont plus leur emplacement 17... Et Michel Saint-Josse, chirurgien esthétique parisien en panne, débarque au camping dans la tente de Patrick. Au milieu des merguez et des douches collectives, il va découvrir une espèce inconnue : le campeur.", actors:"Gérard Lanvin, Mathilde Seigner, Franck Dubosc, Claude Brasseur, Mylène Demongeot, Antoine Duléry, Frédérique Bel"},
 {title:"Camping 2", year:2010, type:"DVD", lienVideo:"https://ok.ru/videoembed/11012231203345" , cat:"comedie", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/73/75/08/19282893.jpg", youtube:"https://youtu.be/pOZ6e5rjwNg", resume:"Jean-Pierre Savelli, employé aux Mutuelles d’Assurances de Clermont-Ferrand, apprend que Valérie, sa fiancée, veut faire un break. Pour se ressourcer et retrouver calme et sérénité, il décide de changer de destination de vacances… Il atterrit au Camping des Flots Bleus et tombe sur Patrick Chirac et sa bande de campeurs irréductibles. Les vacances peuvent commencer! Apéro!", actors:"Franck Dubosc, Richard Anconina, Mathilde Seigner, Claude Brasseur, Mylène Demongeot, Antoine Duléry"},
  {title:"Camping 3", year:2016, type:"DVD", lienVideo:"https://ok.ru/videoembed/11455565990426" , cat:"comedie", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/16/05/23/16/37/346720.jpg", youtube:"https://youtu.be/yHRgemmfRPY?is=wNXayrIiJRn13tvx", resume:"Comme chaque été, au Camping des Flots Bleus se retrouvent pour leurs vacances nos amis, Les Pic, Jacky et Laurette, Gatineau, tout juste divorcé de Sophie, et Patrick Chirac fidèle à ses habitudes. Cette année, Patrick a décidé de tester le co-voiturage... Pensant traverser la France avec Vanessa, il se retrouve avec trois jeunes dijonnais : Robert le charmeur, Benji le beau gosse et José la grande gueule. Bien évidemment, après le co-voiturage, Patrick se voit contraint de tester le co-couchage.", actors:"Franck Dubosc, Claude Brasseur, Mylène Demongeot, Antoine Duléry, Gérard Jugnot, Michèle Laroque, Louka Meliava, Jules Ritmanic, Cyril Mendy"},
 {title:"Cloverfield", year:2008, type:"DVD", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/64/49/97/18862605.jpg", youtube:"https://youtu.be/ZKJ6yPY16kc?is=iwufo-_ZEMVWTeF3", resume:"New York. Une quarantaine d’amis organisent chez Rob une fête pour son départ au Japon. Hud filme la soirée. Soudain, une violente secousse ébranle l’immeuble. Dans la rue, la foule voit une ombre immense dans le ciel, puis la tête de la Statue de la Liberté s’écrase sur la chaussée. L’attaque du siècle vient de commencer. Filmé en found footage, Rob et ses amis tentent de survivre et de sauver Beth au cœur de Manhattan ravagé par une créature monstrueuse.", actors:"Michael Stahl-David, T. J. Miller, Jessica Lucas, Odette Yustman, Lizzy Caplan, Mike Vogel"},
  {title:"Conquest", year:2011, type:"Blu-ray 3D", cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/14/01/20/16/03/599747.jpg", youtube:"https://youtu.be/bmi2CPe5dYw?is=Hw2ME3Lpzi4tnElJ", resume:"Amsterdam, 1596. L'explorateur William Barents prend la mer avec son équipage pour trouver le mythique Passage du Nord, une route maritime vers l'Inde via l'Océan Arctique. Pris dans les glaces de la Nouvelle-Zemble, l'équipage doit hiverner dans des conditions extrêmes. L'histoire est racontée du point de vue de Gerrit de Veer, officier qui a tenu un journal du périple.", actors:"Robert de Hoog, Victor Reinier, Jan Decleir, Doutzen Kroes"},
 {title:"Crimes et Pouvoir", year:2002, type:"DVD", cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/00/02/46/03/crimes.jpg", youtube:"https://youtu.be/PbZw1cAef9w?is=K8DLU6OCTFYj3MHW", resume:"Procureur redouté, Claire Kubik mène une vie de rêve avec son mari Tom. Tout bascule quand le FBI arrête Tom : sous son vrai nom d’agent militaire clandestin Ronald Chapman, il aurait assassiné des civils au Salvador et serait en fuite depuis quinze ans. Claire décide de le défendre et engage Charlie Grimes, ex-procureur militaire marginal, pour affronter la justice militaire. En quête de vérité, Claire risque sa carrière… et sa vie.", actors:"Ashley Judd, Morgan Freeman, Jim Caviezel, Adam Scott, Amanda Peet, Bruce Davison"},
  {title:"Danny the Dog", year:2005, type:"DVD", cat:"action", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/50/74/18401024.jpg", youtube:"https://youtu.be/WcMgkbfJIRg?is=6z8a1uWQYrEs0ALL", resume:"Bart a élevé Danny comme un chien, dressé pour tuer. À 30 ans, il ne connaît de la vie que son maître, la pièce où il est reclus et les combats sanguinaires. Après un règlement de compte, Danny se retrouve seul. Sam, accordeur de piano aveugle, et sa belle-fille Victoria le recueillent. À force d'amour et de patience, ils vont défaire le long apprentissage de la violence qu'il a connu. Mais son passé finit par le rattraper.", actors:"Jet Li, Bob Hoskins, Morgan Freeman, Kerry Condon"},
  {title:"Danse avec les loups", year:1990, type:"DVD", cat:"drame", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/83/23/81/19672460.jpg", youtube:"https://youtu.be/tJ7iL5hQkT8?is=EQ1uu-S9rbLpboOJ", resume:"Guerre de Sécession. Le lieutenant John Dunbar est muté dans un avant-poste isolé de la frontière. Il survit seul, tient son journal et tente d’apprivoiser un loup. Sa rencontre avec la tribu Sioux va bouleverser sa vie : il découvre leur culture, apprend leur langue et devient peu à peu l’un des leurs, prenant le nom de 'Danse avec les Loups'. Mais l’armée américaine progresse et menace le mode de vie des Sioux.", actors:"Kevin Costner, Mary McDonnell, Graham Greene, Rodney A. Grant, Floyd Westerman"},
  {title:"Da Vinci Code", year:2006, type:"DVD", cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/36/20/56/18613332.jpg", youtube:"https://youtu.be/qBmTF-q9XJE?is=3tT_FdqUF_hVhEok", resume:"À Paris, le conservateur du Louvre est assassiné. Avant de mourir, il laisse des symboles cryptés. Le professeur Robert Langdon, spécialiste des symboles, est appelé sur l'affaire. Avec Sophie Neveu, cryptologue, il découvre que les indices mènent à une société secrète : le Prieuré de Sion. Leur enquête les entraîne de Paris à Londres sur la piste du Saint Graal, un secret qui pourrait ébranler les fondements du christianisme.", actors:"Tom Hanks, Audrey Tautou, Ian McKellen, Jean Reno, Paul Bettany, Alfred Molina"},
 {title:"Da vinci code 2 - Anges et Démons", year:2009, type:"DVD", cat:"action", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/64/21/36/20524432.jpg", youtube:"https://youtu.be/6fvLICEn4RI?is=RHZIpf7IRjIJssnI", resume:"Après la mort du pape, quatre cardinaux favoris à sa succession sont enlevés par les Illuminati, société secrète promettant de les exécuter un par un. Le symbologue Robert Langdon est appelé au Vatican pour déjouer un complot visant à détruire la cité sainte avec une bombe à antimatière.", actors:"Tom Hanks, Ayelet Zurer, Ewan McGregor, Stellan Skarsgård"},
 {title:"Django Unchained", year:2012, type:"DVD", cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/90/08/59/20366454.jpg", youtube:"https://youtu.be/K2XjgsfzDrU", resume:"Deux ans avant la Guerre de Sécession, le Dr King Schultz, chasseur de primes allemand, libère Django, un esclave. Il le forme pour traquer les criminels les plus recherchés du Sud. En échange, Schultz aide Django à retrouver sa femme Broomhilda, esclave dans la plantation de l’impitoyable Calvin Candie. Entre western, vengeance et dialogues ciselés, Tarantino signe un film sanglant et jouissif sur l’esclavage.", actors:"Jamie Foxx, Christoph Waltz, Leonardo DiCaprio, Kerry Washington, Samuel L. Jackson"},
 {title:"Dirty Dancing", year:1987, type:"DVD", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/17/08/04/11/57/494883.jpg", youtube:"https://youtu.be/46KOn_zuwpM?is=P_bn5OnxHJVaoIWU", resume:"Été 1963. Bébé, 17 ans, passe des vacances familiales à la pension Kellerman. Fille sage d’une famille aisée, elle découvre un monde nouveau en rencontrant les animateurs du club. Elle tombe amoureuse de Johnny Castle, le prof de danse, et s’initie au 'dirty dancing', cette danse ultra-sensuelle. Entre apprentissage, émancipation et histoire d’amour interdite, Bébé va vivre l’été qui changera sa vie.", actors:"Patrick Swayze, Jennifer Grey, Jerry Orbach, Cynthia Rhodes, Kelly Bishop"},
 {title:"Divergente", year:2014, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/14/02/07/17/46/287879.jpg", youtube:"https://youtu.be/gxbwcBlj_dM?is=uqGoaU5XFV4Kzc1f", resume:"Chicago, monde post-apocalyptique. La société est divisée en 5 factions : Audacieux, Érudits, Altruistes, Sincères, Fraternels. À 16 ans, Tris doit choisir sa faction pour la vie. Mais son test d’aptitude échoue : elle est Divergente. Les Divergents n’appartiennent à aucun clan et sont traqués par le gouvernement. Elle cache son secret et intègre les Audacieux, dont l’entraînement brutal repose sur la maîtrise de ses peurs.", actors:"Shailene Woodley, Theo James, Kate Winslet, Jai Courtney, Zoë Kravitz, Miles Teller"},
 {title:"Divergente 2 : L'Insurrection", year:2015, type:"Blu-ray 3D", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/15/01/28/18/08/152985.jpg", youtube:"https://youtu.be/l4YTrX3gmco?is=LmXYE9yVR2bBW3nQ", resume:"Après avoir révélé le complot des Érudits mené par Jeanine, Tris et Quatre sont en fuite. Traqués par les autorités, ils cherchent des alliés chez les autres factions. La guerre entre les factions éclate et Janine décrète la loi martiale pour anéantir les Divergents. La découverte d’un objet mystérieux hérité du passé pourrait bien bouleverser l’équilibre des forces et révéler la vérité sur leur monde.", actors:"Shailene Woodley, Theo James, Kate Winslet, Naomi Watts, Ansel Elgort, Miles Teller"},
  {title:"Divergente 3 : Au-delà du mur", year:2016, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/16/02/18/15/30/225612.jpg", youtube:"https://youtu.be/OuBaIql0S6k?is=j8GJcTUqj4Qe_QTp", resume:"Sous le choc, Tris et Quatre doivent fuir et franchir le mur encerclant Chicago. Pour la première fois, ils quittent la seule ville et famille qu’ils aient connues. Au-delà du mur se trouve un monde hostile qu’ils vont devoir affronter. Tris et Quatre doivent rapidement déterminer en qui ils peuvent avoir confiance alors qu’une bataille menaçant l’humanité toute entière est sur le point d’éclater.", actors:"Shailene Woodley, Theo James, Ansel Elgort, Miles Teller, Jeff Daniels, Naomi Watts"},
{title:"Voyage sous les mers 3D", year:2009, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/71/42/68/19134174.jpg", youtube:"https://youtu.be/GZ6K-CI1QTI?is=gwNoR8ZqcbxUkuc-", resume:"À travers l'incroyable voyage d'une tortue de mer, plongez au cœur d’une fabuleuse odyssée sous-marine en 3D-Relief. Des récifs coralliens aux abysses, découvrez un monde féérique peuplé de créatures fascinantes, drôles ou inquiétantes. Premier documentaire tourné entièrement en numérique HD et 3D-Relief, avec 26 expéditions et 1500h sous l’eau.", actors:"Marion Cotillard (narratrice VF), Jean-Michel Cousteau"},
  {title:"Dragons", year:2010, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/73/01/74/19343191.jpg", youtube:"https://youtu.be/YFudK_c-z8o", resume:"Sur l'île de Beurk, les Vikings combattent les dragons depuis toujours. Harold, fils du chef Stoïck, est un jeune inventeur maladroit peu doué pour tuer les dragons. Un jour, il touche une Furie Nocturne, l’espèce la plus rare et dangereuse. Au lieu de le tuer, il le soigne et l’apprivoise, le nommant Krokmou. Leur amitié va bouleverser les traditions et prouver que Vikings et dragons peuvent vivre en paix.", actors:"Donald Reignoux, Emmanuel Jacomy, Florine Orphelin, Julien Kramer (VF) / Jay Baruchel, Gerard Butler, America Ferrera (VO)"},
 {title:"Dumbo", year:2019, type:"DVD", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/18/11/15/09/12/3593965.jpg", youtube:"https://youtu.be/lhwAcdj3HKg", resume:"Holt Farrier, ex-star de cirque revenu de guerre, est recruté par Max Medici pour s’occuper d’un éléphanteau aux oreilles disproportionnées, risée du public. Mais quand ses enfants découvrent que Dumbo peut voler, l’entrepreneur V.A. Vandevere et l’acrobate Colette Marchant veulent en faire la star de leur parc spectaculaire. Dumbo s’envole vers de nouveaux sommets aux côtés de Colette, jusqu’à ce que Holt apprenne que sous ses paillettes, Dreamland cache de sombres secrets.", actors:"Colin Farrell, Eva Green, Michael Keaton, Danny DeVito, Alan Arkin"},
 {title:"Edge of Tomorrow", year:2014, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/14/05/23/17/03/300170.jpg", youtube:"https://youtu.be/NYtObD3aAZs?is=qMDMAHz-oqJH3MX_", resume:"Dans un futur proche, des hordes d’extraterrestres appelés Mimics ont envahi la Terre. Aucune armée ne peut les vaincre. Le commandant William Cage, officier sans expérience du combat, est envoyé en mission-suicide et meurt en quelques minutes. Il se réveille inexplicablement à l’aube de la même journée, condamné à revivre la bataille et à mourir encore et encore. Avec l’aide de la guerrière Rita Vrataski, il s’entraîne à chaque boucle pour devenir plus fort et trouver comment anéantir les envahisseurs.", actors:"Tom Cruise, Emily Blunt, Bill Paxton, Brendan Gleeson, Charlotte Riley"},
  {title:"Edward aux mains d'argent", year:1990, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/17/06/29/12/02/081980.jpg", youtube:"https://youtu.be/r6IwTHOKLGc", resume:"Edward n'est pas un garçon ordinaire. Création d'un inventeur décédé avant d'avoir pu l'achever, il a un cœur pour aimer et un cerveau pour comprendre, mais des lames de métal en guise de doigts. Recueilli par Peg Boggs dans une banlieue pastel, il devient la coqueluche du quartier grâce à ses talents pour tailler les haies et coiffer. Mais sa différence et son amour impossible pour Kim vont vite réveiller la méfiance et la cruauté des habitants.", actors:"Johnny Depp, Winona Ryder, Dianne Wiest, Anthony Michael Hall, Vincent Price"},
 {title:"Elysium", year:2013, type:"Blu-ray", cat:"sf", img:"https://fr.web.img2.acsta.net/c_310_420/pictures/210/167/21016768_20130701152230937.jpg", youtube:"https://youtu.be/Ln7SSPfJ0No?is=T7MoAMgQ4M6GykJY", resume:"En 2154, l’humanité est divisée en deux classes. Les ultra-riches vivent sur Elysium, station spatiale luxueuse où tout est parfait : pas de guerre, pas de maladie, pas de pauvreté. Les autres survivent sur une Terre surpeuplée et dévastée. Max Da Costa, ouvrier irradié condamné, accepte une mission suicide : infiltrer Elysium grâce à un exosquelette greffé à son corps. S’il réussit, il pourra non seulement se sauver, mais aussi rétablir l’égalité entre les deux mondes.", actors:"Matt Damon, Jodie Foster, Sharlto Copley, Alice Braga, Diego Luna, William Fichtner"},
  {title:"Esther", year:2009, type:"DVD", cat:"drame", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/71/74/63/19196455.jpg", youtube:"https://youtu.be/k7C6E_ibYa8?is=GIiLUke9WG8lk1xq", resume:"Kate et John adoptent Esther, une fillette de 9 ans étrangement mature et polie. Mais très vite, des incidents troublants surviennent autour d'elle. Kate commence à soupçonner qu'Esther cache un lourd secret et n'est peut-être pas l'enfant innocente qu'elle prétend être.", actors:"Vera Farmiga, Peter Sarsgaard, Isabelle Fuhrman, CCH Pounder"},
{title:"La Stratégie Ender", year:2013, type:"Blu-ray", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/210/485/21048567_20131010185149306.jpg", youtube:"https://youtu.be/vEc2prHRsx4?is=woa32NT4niZXXnDv", resume:"Dans un futur proche, les Formics ont attaqué la Terre. Pour préparer la prochaine invasion, la Flotte Internationale recrute les enfants les plus doués. Ender Wiggin, garçon timide mais génie de la stratégie, intègre l'École de Guerre. Il maîtrise rapidement les jeux de bataille en apesanteur et devient le meilleur espoir de l’humanité. Formé par le légendaire Mazer Rackham, il devra commander la flotte dans une bataille décisive pour le sort de la Terre.", actors:"Asa Butterfield, Harrison Ford, Ben Kingsley, Hailee Steinfeld, Viola Davis, Abigail Breslin"},
 {title:"Everest", year:2015, type:"Blu-ray 3D", cat:"action", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/15/07/02/12/46/372128.jpg", youtube:"https://youtu.be/H0J23Tk_lfY", resume:"Inspiré de faits réels survenus en mai 1996. Deux expéditions tentent l’ascension de l’Everest mais sont frappées par l’une des plus violentes tempêtes de neige jamais enregistrées. Piégés à 8 000m d’altitude, les grimpeurs affrontent des vents déchaînés, le froid extrême et le manque d’oxygène. Leur rêve se transforme en combat pour leur survie où chaque décision peut être fatale.", actors:"Jason Clarke, Josh Brolin, Jake Gyllenhaal, John Hawkes, Robin Wright, Keira Knightley, Emily Watson, Sam Worthington"},
 {title:"Exodus : Gods and Kings", year:2014, type:"Blu-ray", cat:"peplum", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/14/10/28/11/52/425795.jpg", youtube:"https://youtu.be/t-8YsulfxVI", resume:"Ridley Scott revisite l’histoire de Moïse. Élevé à la cour du pharaon Séthi aux côtés de Ramsès, Moïse découvre ses origines hébraïques et s’oppose au nouveau pharaon Ramsès II. Banni dans le désert, il revient pour libérer 600 000 esclaves hébreux. Face au refus de Ramsès, l’Égypte subit les dix plaies. Commence alors un périple épique : la traversée de la mer Rouge et l’exode vers la Terre Promise.", actors:"Christian Bale, Joel Edgerton, John Turturro, Aaron Paul, Ben Kingsley, Sigourney Weaver"},
 {title:"Fantômes contre fantômes", year:1996, type:"DVD", cat:"comedie", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/79/28/12/19495802.jpg", youtube:"https://youtu.be/feV-YDSKS0M?is=oqPko0TGLPrUxm2f", resume:"Frank Bannister, architecte devenu chasseur de fantômes après la mort de sa femme, arnaque les habitants avec l’aide de trois revenants : Le Juge, Cyrus et Stuart. Quand une petite ville est frappée par une série de morts suspectes, Frank devient le suspect idéal. Il doit alors affronter un véritable spectre-tueur, l’esprit d’un serial killer, pour laver son nom et sauver la ville.", actors:"Michael J. Fox, Trini Alvarado, Peter Dobson, John Astin, Chi McBride, Jim Fyfe, Jeffrey Combs"},
  {title:"Flashdance", year:1983, type:"DVD", cat:"drame", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/65/19/95/18836068.jpg", youtube:"https://youtu.be/t9GJ9AWE9M4?is=ZtAKIPOxQLr29xV-", resume:"À Pittsburgh, Alex Owens, 18 ans, bosse la journée comme soudeuse dans une aciérie et danse le soir dans un cabaret. Sa vraie passion : la danse. Autodidacte, elle rêve d’entrer au Conservatoire de Danse mais n’ose pas s’inscrire. Avec le soutien de Nick, son patron tombé sous son charme, et de sa mentor Hanna, Alex va tenter l’audition de sa vie sur “What a Feeling” et “Maniac”. Film culte des années 80, Oscar de la Meilleure Chanson.", actors:"Jennifer Beals, Michael Nouri, Lilia Skala, Sunny Johnson, Kyle T. Heffner"},
 {title:"Friends - L'Intégrale", year:1994, type:"Blu-ray", cat:"serie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/18/11/13/14/05/2764761.jpg", youtube:"https://youtu.be/-6-rrJIL-nM?is=JA8T5t_2Ae9pbTCY", resume:"Les péripéties de 6 jeunes New-Yorkais liés par une profonde amitié. Entre amour, travail, famille, ils partagent leurs bonheurs et leurs soucis au Central Perk, leur café favori. Monica, Rachel, Phoebe, Ross, Chandler et Joey : 10 saisons, 236 épisodes cultes qui ont marqué toute une génération.", actors:"Jennifer Aniston, Courteney Cox, Lisa Kudrow, Matt LeBlanc, Matthew Perry, David Schwimmer"},
  {title:"Fury", year:2014, type:"Blu-ray", cat:"action", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/14/09/22/16/44/411457.jpg", youtube:"https://youtu.be/OjrvwoAhqF0", resume:"Avril 1945. Les Alliés mènent leur ultime offensive en Europe. À bord d’un char Sherman surnommé 'Fury', le sergent Wardaddy et ses quatre hommes s’engagent dans une mission à très haut risque bien au-delà des lignes ennemies. Face à un adversaire supérieur en nombre et en puissance de feu, l’équipage va devoir tout tenter pour frapper l’Allemagne nazie en plein cœur. 24h d’enfer avec Brad Pitt en chef de char aguerri.", actors:"Brad Pitt, Shia LaBeouf, Logan Lerman, Michael Peña, Jon Bernthal, Jason Isaacs"},
  {title:"Fusion", year:2003, type:"DVD", cat:"sf", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/35/06/00/affiche2.jpg", youtube:"https://youtu.be/iHAR0crD5O0?is=ftmH5DFAvn0cNOkO", resume:"Le noyau interne de la Terre a cessé de tourner, provoquant des catastrophes en chaîne à travers le monde. Un groupe de scientifiques et deux astronautes s'enfoncent dans les profondeurs du globe à bord d'un vaisseau expérimental pour relancer le noyau à coups d'explosions nucléaires, avant que la planète ne devienne inhabitable.", actors:"Aaron Eckhart, Hilary Swank, Delroy Lindo, Stanley Tucci"},
{title:"Gangs of New York", year:2002, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/36/75/affiche1.jpg", youtube:"https://youtu.be/qHVUPri5tjA", resume:"1846, quartier de Five Points à New York. Les 'Dead Rabbits' irlandais menés par le Père Vallon affrontent les 'Native Americans' de Bill le Boucher. Bill tue Vallon et prend le contrôle des rues. 16 ans plus tard, Amsterdam, fils de Vallon, revient infiltrer le gang de Bill pour venger son père. Sur fond de guerre de Sécession et d'émeutes, il va se retrouver déchiré entre vengeance et son amour pour la pickpocket Jenny Everdeane.", actors:"Leonardo DiCaprio, Daniel Day-Lewis, Cameron Diaz, Jim Broadbent, John C. Reilly, Liam Neeson"},
 {title:"Germinal", year:1993, type:"DVD", cat:"drame", img:"https://fr.web.img3.acsta.net/c_310_420/pictures/17/10/12/16/23/4875124.jpg", youtube:"https://youtu.be/F6zZsdvgvQc?is=dxawBoppfRlaHOX0", resume:"A la fin du XIXe siècle, Etienne Lantier arrive à Montsou, un village minier. Avec l'aide de Maheu, un ouvrier haveur, il parvient à se faire embaucher. Quand l'un des sept enfants Maheu, Zacharie, se marie, Etienne prend sa place dans la maison familiale. Il s'est lié d'amitié avec Maheu...", actors:"Renaud , Depardieu , Miou-Miou"},
 {title:"Kill the Gringo", year:2012, type:"Blu-ray", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/94/33/67/20320608.jpg", youtube:"https://youtu.be/MERP8u3gvbw?is=3706qTCDVhKrvzcN", resume:"Un criminel américain se fait arrêter au Mexique avec 2 millions de dollars volés. Incarcéré dans une prison ultra-violente où règnent corruption et trafics, il découvre que cet 'El Pueblito' est une mini-ville tenue par les détenus. Pour survivre, il s’allie à un gamin de 9 ans dont le foie intéresse Javi, le parrain local. Avec l’aide du Kid, le Gringo va tenter de récupérer son fric et faire tomber tout le système.", actors:"Mel Gibson, Kevin Hernandez, Daniel Giménez Cacho, Dolores Heredia, Peter Stormare"},
  {title:"Ghost Rider 2 : L'Esprit de Vengeance", year:2012, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/85/43/88/19997438.jpg", youtube:"https://youtu.be/Z9AZB6cqYgg", resume:"8 ans après San Venganza, Johnny Blaze vit reclus en Europe de l'Est pour fuir sa malédiction. Moreau, un moine guerrier, le recrute pour sauver Danny, un gamin que le Diable veut posséder pour s’incarner. En échange, l’Église promet de libérer Johnny du Ghost Rider. Mais quand le Diable prend l’apparence de Roarke et que Blackout entre en jeu, Blaze va devoir laisser le Rider se déchaîner pour sauver le garçon.", actors:"Nicolas Cage, Ciarán Hinds, Violante Placido, Idris Elba, Johnny Whitworth, Christophe Lambert"},
  {title:"Gladiator", year:2000, type:"Blu-ray", cat:"peplum", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/68/64/41/19254510.jpg", youtube:"https://youtu.be/ChcgxBAzrks?is=EpTtI9npboha9UE3", resume:"En 180 après J.-C., le général Maximus Decimus Meridius mène les légions romaines à la victoire. Marc Aurèle veut lui confier l’Empire pour restaurer la République. Mais Commode, fils de l’empereur, assassine son père et ordonne la mort de Maximus. Il s’échappe, mais sa femme et son fils sont massacrés. Réduit en esclavage, Maximus devient gladiateur. Porté par la foule du Colisée, il remonte jusqu’à Rome pour accomplir sa vengeance : affronter Commode dans l’arène.", actors:"Russell Crowe, Joaquin Phoenix, Connie Nielsen, Oliver Reed, Richard Harris, Djimon Hounsou, Derek Jacobi"},
 {title:"Gladiator II", year:2024, type:"Blu-ray", cat:"peplum", img:"https://fr.web.img3.acsta.net/c_310_420/img/d6/5b/d65be9c3a6f9dc13a987f71c59351855.jpg", youtube:"https://youtu.be/ggVstyjWMR0", resume:"Des années après la mort de Maximus, Lucius, fils de Lucilla et neveu de Commode, mène une vie paisible en Numidie. Quand les légions romaines du général Marcus Acacius envahissent sa région, il perd tout et devient esclave. Envoyé au Colisée, Lucius doit survivre dans l’arène pour assouvir sa vengeance. Manipulé par Macrinus, un puissant marchand, il découvre que sa mère Lucilla est toujours en vie et que Rome est dirigée par deux empereurs tyranniques.", actors:"Paul Mescal, Pedro Pascal, Denzel Washington, Connie Nielsen, Joseph Quinn, Fred Hechinger, Derek Jacobi"},
  {title:"Godzilla", year:2014, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/14/03/25/14/43/167915.jpg", youtube:"https://youtu.be/wLY-roD488U", resume:"Joe Brody, physicien nucléaire, perd sa femme lors d’un incident à la centrale de Janjira au Japon. 15 ans plus tard, son fils Ford, soldat de la Navy, le retrouve persuadé qu’on leur cache la vérité. Ils découvrent que les essais nucléaires dans le Pacifique tentaient en fait d’éliminer des créatures titanesques. Quand deux MUTO sont réveillés, Godzilla émerge pour rétablir l’équilibre. Entre San Francisco et Hawaï, l’humanité assiste au combat des titans.", actors:"Aaron Taylor-Johnson, Bryan Cranston, Elizabeth Olsen, Ken Watanabe, Sally Hawkins, Juliette Binoche, David Strathairn"},
  {title:"Gravity", year:2013, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/210/232/21023233_20130729173134181.jpg", youtube:"https://youtu.be/DKKpespYHkg?is=oV7ATswkz1yFf6Ge", resume:"Pour sa première mission spatiale, le Dr Ryan Stone accompagne l’astronaute chevronné Matt Kowalski. Mais une pluie de débris pulvérise leur navette. Seuls survivants, dérivant dans le silence absolu de l’espace, ils n’ont plus aucun lien avec la Terre. L’oxygène s’épuise. Chaque seconde compte. Stone va devoir surmonter la panique et trouver en elle la force de survivre pour espérer rentrer. Un huis clos spatial à couper le souffle.", actors:"Sandra Bullock, George Clooney, Ed Harris"},
 {title:"Green Lantern", year:2011, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/71/59/31/19759992.jpg", youtube:"https://youtu.be/Stl7-WaK4O8?is=7xLZ6L6nERrOof6B", resume:"Hal Jordan est un pilote d’essai talentueux mais imprudent. Un jour, il est choisi par l’anneau d’Abin Sur, Green Lantern mourant, pour intégrer le Green Lantern Corps : une confrérie intergalactique chargée de maintenir la paix. Premier humain à porter l’anneau, Hal doit vite maîtriser ce pouvoir qui matérialise tout ce qu’il imagine. Car Parallax, une entité alimentée par la peur, menace la Terre et Oa. Soutenu par Carol Ferris et formé par Sinestro, Hal va devoir prouver qu’il est digne d’être le plus grand Green Lantern.", actors:"Ryan Reynolds, Blake Lively, Peter Sarsgaard, Mark Strong, Tim Robbins, Temuera Morrison, Angela Bassett"},
 {title:"Haute sécurité", year:1989, type:"DVD", cat:"action", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/14/08/26/14/38/508039.jpg", youtube:"https://youtu.be/7SiThBKrKNI?is=Bzd__BLgLSbEzGB-", resume:"Après avoir purgé une peine légère, Frank Leone est sur le point de quitter la prison. Mais Drumgoole, le gardien de l'établissement humilié dans le passé par Frank Leone, entend ne pas laisser sortir son prisonnier si facilement.", actors:"Sylvester Stallone, Donald Sutherland, John Amos, Darlanne Fluegel, Sonny Landham, Tom Sizemore, Frank McRae"},
 {title:"Harry Potter à l'école des sorciers", year:2001, type:"DVD", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/18/07/02/17/25/3643090.jpg", youtube:"https://youtu.be/P1BGgqhVGAI?is=VPuApC8LR1UcPp5F", resume:"Le jeune Harry Potter découvre le jour de ses onze ans qu'il est un sorcier et qu'il est attendu à l'école de Poudlard. Avec ses nouveaux amis Ron et Hermione, il perce peu à peu le mystère de la pierre philosophale et affronte les premiers signes du retour du mage noir Voldemort.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Richard Harris, Maggie Smith, Alan Rickman"},
{title:"Harry Potter et la Chambre des secrets", year:2002, type:"DVD", cat:"famille", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/53/35/affiche0.jpg", youtube:"https://youtu.be/Z3T8PuWuoL0?is=VTbYsWaeTxHYtppY", resume:"De retour à Poudlard pour sa deuxième année, Harry entend des voix que lui seul perçoit et découvre qu'une mystérieuse Chambre des Secrets aurait été rouverte. Des élèves sont retrouvés pétrifiés et Harry doit percer le secret de l'héritier de Serpentard avant qu'il ne soit accusé à tort.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Kenneth Branagh, Jason Isaacs"},
{title:"Harry Potter et le Prisonnier d'Azkaban", year:2004, type:"DVD", cat:"famille", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/35/23/41/18378380.jpg", youtube:"https://youtu.be/CLncEeVf4ks?is=iB4phkE-8OrNZKTV", resume:"Sirius Black, un dangereux meurtrier évadé de la prison d'Azkaban, semble en vouloir à Harry. Alors que des Détraqueurs patrouillent autour de Poudlard pour le retrouver, Harry apprend la vérité sur son parrain et sur la trahison qui a coûté la vie à ses parents.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Gary Oldman, David Thewlis"},
{title:"Harry Potter et la Coupe de feu", year:2005, type:"DVD", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/35/52/34/18450888.jpg", youtube:"https://youtu.be/XO9rqIgzDL0?feature=shared", resume:"Harry se retrouve malgré lui inscrit au Tournoi des Trois Sorciers, une compétition réservée aux élèves majeurs. Entre épreuves périlleuses et premiers émois adolescents, il va découvrir que ce tournoi cache un piège orchestré pour permettre le retour de Voldemort.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Ralph Fiennes, Brendan Gleeson"},
{title:"Harry Potter et l'Ordre du Phénix", year:2007, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/36/32/70/18778375.jpg", youtube:"https://youtu.be/S8-SXEGMmi4?is=YXiOtkP5v7a3XOpj", resume:"Le ministère de la Magie refuse d'admettre le retour de Voldemort et impose à Poudlard une professeure autoritaire, Dolores Ombrage. Harry forme alors clandestinement l'Armée de Dumbledore pour préparer ses camarades à se défendre face à la menace qui grandit.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Imelda Staunton, Ralph Fiennes"},
{title:"Harry Potter et le Prince de sang-mêlé", year:2009, type:"DVD", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/65/64/35/19116952.jpg", youtube:"https://youtu.be/yb-VYG3x5E8?is=VSayJD5g6YkflXae", resume:"Dumbledore confie à Harry une mission délicate : convaincre le professeur Slughorn de lui révéler un souvenir essentiel sur la jeunesse de Voldemort. Pendant ce temps, Harry met la main sur un manuel annoté par un mystérieux 'Prince de Sang-Mêlé' qui va bouleverser son parcours.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Jim Broadbent, Tom Felton"},
{title:"Harry Potter et les Reliques de la Mort - partie 1", year:2010, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/69/69/81/19590744.jpg", youtube:"https://youtu.be/HgZZsnleZJQ?is=W4Dm3-gVbnogzxgO", resume:"Harry, Ron et Hermione abandonnent leurs études pour partir en quête des Horcruxes, ces objets contenant des fragments de l'âme de Voldemort, seul moyen de le détruire définitivement. Traqués sans relâche, ils découvrent aussi la légende des Reliques de la Mort.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Bill Nighy, Rhys Ifans"},
{title:"Harry Potter et les Reliques de la Mort - partie 2", year:2011, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/78/64/49/19762436.jpg", youtube:"https://youtu.be/aiaIfICU-Tk?is=9SfM3uEQJJVPbf4C", resume:"L'affrontement final entre Harry et Lord Voldemort approche. Alors que Poudlard se transforme en champ de bataille, Harry doit détruire les derniers Horcruxes et accepter son destin de 'Survivant' pour mettre fin, une fois pour toutes, au règne de terreur du mage noir.", actors:"Daniel Radcliffe, Rupert Grint, Emma Watson, Ralph Fiennes, Maggie Smith, Alan Rickman"},
{title:"Hercule", year:2014, type:"Blu-ray 3D", cat:"peplum", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/14/07/22/14/05/515154.jpg", youtube:"https://youtu.be/LnaS4CU-obc?is=VAjkKY8OebfzRpsd", resume:"Après avoir accompli ses douze travaux, Hercule met désormais sa force légendaire au service du plus offrant, accompagné d'une bande de mercenaires. Engagé par le roi de Thrace pour former son armée, il va devoir affronter un piège qui menace de le détruire.", actors:"Dwayne Johnson, Ian McShane, John Hurt, Rufus Sewell, Joseph Fiennes"},
  {title:"Highlander", year:1986, type:"DVD",  lienVideo:"https://www.tokyvideo.com/embed/310641/highlander-1986-action-cinema-de-fantasy-1h-56m" , cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/60/08/58/18608156.jpg", youtube:"https://youtu.be/pEhrVh5YJN0?is=nJq2qZdy-Y2LdXJE", resume:"Connor MacLeod, né en 1518 dans les Highlands d’Écosse, découvre qu’il est immortel après sa première mort. Formé par Ramirez, il traverse les siècles en affrontant d’autres immortels. Le seul moyen de les tuer : leur trancher la tête. En 1985 à New York, sous l’identité de Russell Nash, antiquaire, il retrouve son ennemi juré : le Kurgan. Commence alors le combat final pour le « Prix » : le pouvoir ultime accordé au dernier immortel vivant. Il ne peut en rester qu’un.", actors:"Christophe Lambert, Sean Connery, Roxanne Hart, Clancy Brown, Beatie Edney, Alan North"},
  {title:"Hulk 1", year:2003, type:"Blu-ray", cat:"sf", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/00/02/54/34/affiche2.jpg", youtube:"https://youtu.be/n5xO7qjVcdQ?is=77SilkSIawJ4pbJr", resume:"Au cours d'une opération scientifique qui a mal tourné, le docteur Bruce Banner est exposé à une surdose de radiations nucléaires. Miraculeusement indemne, il sort néanmoins affecté de cette douloureuse expérience et développe le pouvoir de se transformer en Hulk, un monstre vert à la force surhumaine et à la rage incontrôlable. Cette créature ne se manifeste que lorsque ce dernier est soumis à une intense émotion. Mis au ban de la société, le docteur Banner est obligé de se cacher pour ne pas faire subir aux autres sa métamorphose. Le général Ross, le père de Betty, l'ex-petite amie de Bruce, est chargé de stopper le monstre par tous les moyens. Glenn Talbot, rival scientifique de Banner, est également sur les traces de Hulk. Lorsque Betty découvre que la créature a un rapport avec les recherches du père de Bruce, elle devient la seule à pouvoir comprendre ce qu'est Hulk...", actors:"Eric Bana, Jennifer Connelly, Nick Nolte"},
  {title:"Hunger Games", year:2012, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/85/51/91/20018884.jpg", youtube:"https://youtu.be/T_OUuZBWRiE?is=49wQeiDCNjwnHF49", resume:"Dans les ruines de l’Amérique, Panem est une nation divisée en 12 districts contrôlés par le Capitole. Chaque année, les Hunger Games forcent chaque district à envoyer un garçon et une fille combattre à mort dans une arène télévisée. Quand Prim, 12 ans, est tirée au sort dans le District 12, sa sœur Katniss Everdeen se porte volontaire pour la remplacer. Aux côtés de Peeta, l’autre tribut du district, Katniss va défier les règles du jeu et devenir le symbole d’une rébellion naissante.", actors:"Jennifer Lawrence, Josh Hutcherson, Liam Hemsworth, Woody Harrelson, Elizabeth Banks, Stanley Tucci, Donald Sutherland, Lenny Kravitz"},
 {title:"Hunger Games : L'Embrasement", year:2013, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/210/453/21045319_2013101714250983.jpg", youtube:"https://youtu.be/nbzjLhsmVXc?is=ebub2PaOuswDqH-I", resume:"Après avoir gagné les 74e Hunger Games avec Peeta, Katniss Everdeen est devenue malgré elle le symbole de la rébellion. Alors qu’elle entame la Tournée de la Victoire à travers les districts, le Capitole voit d’un mauvais œil l’espoir qu’elle suscite. Pour l’édition des 75e Hunger Games, les Jeux de l’Expiation, le président Snow annonce que les tributs seront choisis parmi les anciens vainqueurs. Katniss doit retourner dans l’arène avec Peeta. Mais cette fois, les règles ont changé.", actors:"Jennifer Lawrence, Josh Hutcherson, Liam Hemsworth, Woody Harrelson, Elizabeth Banks, Philip Seymour Hoffman, Donald Sutherland, Sam Claflin, Jena Malone"},
 {title:"Hunger Games : La Révolte - Partie 1", year:2014, type:"Blu-ray", cat:"fiction", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/14/12/05/17/25/453259.jpg", youtube:"https://youtu.be/zdMIft77FEY", resume:"Après avoir détruit l’arène des 75e Hunger Games, Katniss Everdeen se réveille dans le District 13, un district que tous croyaient anéanti. Sous le commandement de la Présidente Coin et avec les conseils de Plutarch, Haymitch et ses amis, elle devient le Geai Moqueur : le symbole de la rébellion contre le Capitole. Tandis que la guerre totale éclate à Panem, Katniss doit sauver Peeta, retenu et manipulé par le Capitole, et mener la révolte.", actors:"Jennifer Lawrence, Josh Hutcherson, Liam Hemsworth, Woody Harrelson, Elizabeth Banks, Julianne Moore, Philip Seymour Hoffman, Donald Sutherland, Jeffrey Wright"},
 {title:"Independence Day", year:1996, type:"DVD", cat:"sf", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/73/27/10/19196653.jpg", youtube:"https://youtu.be/lYaVIrVB9x8?is=VEJ2H6wCqI-_UpfR", resume:"Le 2 juillet, d’immenses vaisseaux extraterrestres prennent position au-dessus des plus grandes villes du monde. Le 3 juillet, ils lancent une attaque coordonnée qui rase les métropoles. Le 4 juillet, jour de la fête nationale américaine, le président Whitmore, le pilote Steve Hiller et l’informaticien David Levinson tentent une contre-attaque désespérée depuis la Zone 51. L’humanité joue sa survie face à des envahisseurs venus piller les ressources de la Terre.", actors:"Will Smith, Bill Pullman, Jeff Goldblum, Mary McDonnell, Judd Hirsch, Robert Loggia, Randy Quaid, Margaret Colin, Vivica A. Fox, James Rebhorn, Harvey Fierstein, Brent Spiner"},
  {title:"Independence Day : Résurgence", year:2016, type:"Blu-ray", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/16/05/26/09/17/421833.jpg", youtube:"https://youtu.be/K02fIwZe_sY", resume:"20 ans après l’invasion de 1996, l’humanité s’est relevée grâce à la technologie extraterrestre récupérée. Toutes les nations ont collaboré pour créer un programme de défense planétaire. Mais les aliens reviennent avec une force de frappe sans précédent : un vaisseau-mère de 4800 km de diamètre. David Levinson, l’ex-président Whitmore, et une nouvelle génération de pilotes dont Jake Morrison et Dylan Hiller doivent à nouveau sauver la Terre de l’extinction.", actors:"Liam Hemsworth, Jeff Goldblum, Bill Pullman, Maika Monroe, Jessie Usher, Sela Ward, William Fichtner, Charlotte Gainsbourg, Judd Hirsch, Brent Spiner, Vivica A. Fox"},
  {title:"Les Aventuriers de l'Arche perdue", year:1981, type:"DVD", cat:"fiction", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/00/02/49/18/affiche.jpg", youtube:"https://youtu.be/gBdoKaW0o9M?is=uYLvRuw3mJzKf-ET", resume:"En 1936, l’archéologue Indiana Jones est mandaté par les services secrets américains pour retrouver l’Arche d’Alliance avant les nazis. Il doit d’abord récupérer le Médaillon de Râ au Népal, détenu par son ex Marion Ravenwood. La course à l’Arche les mène du Népal au Caire, puis sur une île grecque. Hitler veut s’emparer de la relique biblique aux pouvoirs inimaginables pour assurer l’invincibilité du IIIe Reich. Entre pièges, serpents et trahisons, Indy va tout faire pour empêcher les nazis d’ouvrir l’Arche.", actors:"Harrison Ford, Karen Allen, Paul Freeman, John Rhys-Davies, Denholm Elliott, Wolf Kahler, Ronald Lacey, Alfred Molina"},
  {title:"Indiana Jones et le Temple maudit", year:1984, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/65/88/36/18931015.jpg", youtube:"https://youtu.be/yDmfPWBAzDE?is=qqaAG73LaIhf4D9C", resume:"En 1935 à Shanghai, Indy échange les cendres d’un empereur contre un diamant avec le mafieux Lao Che. La transaction tourne mal : il s’enfuit avec la chanteuse Willie Scott et son acolyte Demi-Lune. Après un crash en Inde, ils arrivent dans un village dont les enfants ont été enlevés et la pierre sacrée volée par la secte des Thugs. Indiana découvre le temple maudit de la déesse Kali, où le prêtre Mola Ram pratique des sacrifices humains et réduit des enfants en esclavage dans les mines.", actors:"Harrison Ford, Kate Capshaw, Ke Huy Quan, Amrish Puri, Roshan Seth, Philip Stone"},
 {title:"Indiana Jones et la Dernière Croisade", year:1989, type:"DVD", cat:"fiction", img:"https://fr.web.img5.acsta.net/c_310_420/medias/nmedia/18/65/88/40/18895516.jpg", youtube:"https://youtu.be/1-AM8x_ZprA?is=j0UzTXfEQ_RSm6m5", resume:"En 1938, Indiana Jones apprend que son père, le professeur Henry Jones, a disparu alors qu’il cherchait le Saint Graal. Indy part pour Venise, où son père a été vu pour la dernière fois. Avec son journal comme seul indice, il découvre que les nazis convoitent aussi le Graal pour ses vertus d’immortalité. Père et fils, que tout oppose, vont devoir s’allier pour retrouver la coupe sacrée avant qu’elle ne tombe entre de mauvaises mains.", actors:"Harrison Ford, Sean Connery, Denholm Elliott, Alison Doody, John Rhys-Davies, Julian Glover, River Phoenix"},
 {title:"Indiana Jones et le Royaume du Crâne de Cristal", year:2008, type:"DVD", cat:"fiction", img:"https://fr.web.img3.acsta.net/c_310_420/medias/nmedia/18/63/95/41/18927494.jpg", youtube:"https://youtu.be/wBp4FRfAgsg?is=5yy--Zct-O8_d_Al", resume:"Nous sommes en 1957, en pleine Guerre Froide. Indiana Jones et son ami Mac viennent d’échapper à des agents soviétiques dirigés par Irina Spalko, à la recherche d’une relique mystérieuse. De retour au Marshall College, Indy est licencié, suspecté par le gouvernement. Un jeune motard rebelle, Mutt Williams, lui propose alors de l’aider à retrouver le Crâne de Cristal d’Akator et sauver le professeur Oxley, enlevé. Direction l’Amazonie, où les Russes veulent aussi mettre la main sur la relique aux pouvoirs surnaturels.", actors:"Harrison Ford, Shia LaBeouf, Cate Blanchett, Karen Allen, Ray Winstone, John Hurt, Jim Broadbent"},
{title:"Il faut sauver le soldat Ryan", year:1998, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/04/22/53/042253_af.jpg", youtube:"https://youtu.be/oABZgCwALew?is=f2c6p0UdpdNd2Ai-", resume:"Après le débarquement de Normandie, le capitaine Miller et ses hommes reçoivent une mission particulière : retrouver le soldat James Ryan, dont les trois frères viennent d'être tués au combat, afin de le ramener sain et sauf à sa mère.", actors:"Tom Hanks, Matt Damon, Tom Sizemore, Edward Burns, Vin Diesel"},
{title:"Il était une fois l homme", year:1979, type:"DVD", cat:"famille", img:"https://fr.web.img4.acsta.net/c_310_420/pictures/20/09/15/15/21/1174674.jpg", youtube:"https://youtu.be/igSecV-wUj4?is=qlK5FjkB1nuOrgfm", resume:"L'histoire de l'humanité, des origines de la vie jusqu'à la fin du XXe siècle.", actors:"Anie Balestra, Albert Barillé, Yves Barsacq"},
  {title:"Inglourious Basterds", year:2009, type:"DVD", cat:"action", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/70/45/22/19123474.jpg", youtube:"https://youtu.be/TnyEVXNwySg?is=IqSCDEsaIOoMSKZs", resume:"Dans la France occupée de 1941, Shosanna Dreyfus assiste à l'exécution de sa famille par le colonel nazi Hans Landa. Elle s'échappe et devient exploitante d'un cinéma à Paris. Ailleurs en Europe, le lieutenant Aldo Raine forme les 'Bâtards', un groupe de soldats juifs américains qui scalpent les nazis. Avec l'actrice et agent double Bridget von Hammersmark, ils préparent un attentat contre les hauts dignitaires du Reich. Leurs destins convergent dans le cinéma de Shosanna, où elle prépare sa propre vengeance.", actors:"Brad Pitt, Mélanie Laurent, Christoph Waltz, Eli Roth, Michael Fassbender, Diane Kruger, Daniel Brühl, Til Schweiger, B.J. Novak"},
  {title:"Inception", year:2010, type:"DVD", cat:"fiction", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/72/34/14/19476654.jpg", youtube:"https://youtu.be/CPTIgILtna8", resume:"Dom Cobb est un voleur expérimenté dans l’art périlleux de l’extraction : il s’approprie les secrets les plus précieux d’un individu en s’infiltrant dans son subconscient pendant qu’il rêve. Fugitif recherché dans le monde entier, il se voit offrir une chance de retrouver sa vie d’avant. Sa mission : l’inception, implanter une idée dans l’esprit de Robert Fischer. Avec son équipe, Cobb plonge dans des rêves à plusieurs niveaux. Mais Mal, la projection de sa femme décédée, hante chaque strate et menace de tout faire échouer.", actors:"Leonardo DiCaprio, Marion Cotillard, Joseph Gordon-Levitt, Ellen Page, Tom Hardy, Ken Watanabe, Cillian Murphy, Michael Caine, Tom Berenger"},
 {title:"Interstellar", year:2014, type:"DVD", cat:"sf", img:"https://fr.web.img5.acsta.net/c_310_420/pictures/14/09/24/12/08/158828.jpg", youtube:"https://youtu.be/HsPP6xSzQoE", resume:"Dans un futur proche, la Terre est devenue hostile et l’humanité est menacée d’extinction. L’ancien pilote de la NASA Cooper, devenu agriculteur, est recruté pour une mission de la dernière chance : franchir un trou de ver apparu près de Saturne et explorer des planètes potentiellement habitables. Il laisse derrière lui sa fille Murph, avec la promesse de revenir. Entre relativité, dilatation du temps et amour transcendant l’espace-temps, l’équipage repousse les limites de l’exploration humaine pour sauver l’espèce.", actors:"Matthew McConaughey, Anne Hathaway, Jessica Chastain, Mackenzie Foy, Michael Caine, Casey Affleck, Ellen Burstyn, John Lithgow, Wes Bentley, David Gyasi, Topher Grace"},
  {title:"I, Robot", year:2004, type:"Blu-ray 3D", cat:"sf", img:"https://fr.web.img4.acsta.net/c_310_420/medias/nmedia/18/35/23/49/18381860.jpg", youtube:"https://youtu.be/PjECS38ZGWE?is=efnMOj7odfGHf1Ks", resume:"En 2035, les robots sont devenus de parfaits assistants pour les humains. Tous obéissent aux trois lois de la robotique : ne jamais faire de mal à un humain. Quand le docteur Alfred Lanning, pionnier de la robotique, est retrouvé mort, le détective Del Spooner enquête. Le principal suspect : Sonny, un robot NS-5. Spooner, qui déteste les robots depuis un accident, découvre que Sonny semble avoir des émotions. Derrière ce meurtre se cache une menace bien plus grande pour l’humanité, orchestrée par l’IA VIKI.", actors:"Will Smith, Bridget Moynahan, Alan Tudyk, Bruce Greenwood, James Cromwell, Chi McBride, Shia LaBeouf"},
  {title:"Jack le Chasseur de Géants", year:2013, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/95/23/65/20463658.jpg", youtube:"https://youtu.be/quiYWSrZ51w?is=E7lsTEkgTvWscKJU", resume:"Un jeune fermier, Jack, ouvre par inadvertance un portail entre notre monde et celui d’une race terrifiante de géants. Débarquant sur Terre pour la première fois depuis des siècles, les géants veulent reconquérir leur territoire perdu. Jack doit alors livrer le combat de sa vie pour les arrêter. Luttant pour le royaume, son peuple et l’amour de la princesse Isabelle, il affronte des guerriers invincibles qu’il croyait n’exister que dans les contes. L’occasion pour lui de devenir une légende.", actors:"Nicholas Hoult, Eleanor Tomlinson, Ewan McGregor, Stanley Tucci, Ian McShane, Bill Nighy, Ewen Bremner, Eddie Marsan"},
{title:"Je suis une légende", year:2007, type:"Blu-ray", cat:"sf", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/63/18/01/18866172.jpg", youtube:"https://www.youtube.com/watch?v=yTNKbLhVAQA", resume:"Trois ans après une pandémie qui a anéanti l'humanité, le savant Robert Neville semble être le dernier homme survivant à New York, immunisé contre le virus. Chaque jour il diffuse des appels radio dans l'espoir de trouver d'autres survivants, tout en évitant les 'Infectés', créatures nocturnes assoiffées de sang qui rôdent dans la ville déserte.", actors:"Will Smith, Alice Braga, Charlie Tahan"},
 {title:"Jeanne d'Arc", year:1999, type:"DVD", cat:"action", img:"https://fr.web.img2.acsta.net/c_310_420/medias/nmedia/18/66/28/02/19087754.jpg", youtube:"https://youtu.be/Byd5wwCXd8k?is=o9iM2Ky5RNIca_1o", resume:"Jeune paysanne de Domrémy, Jeanne assiste au pillage de son village par les Anglais. Poussée par des voix célestes, elle part délivrer la France de l’occupation anglaise. Reçue par le dauphin Charles VII, elle obtient une armée et lève le siège d’Orléans. Sacré roi à Reims, Charles VII l’abandonne ensuite. Capturée par les Bourguignons, vendue aux Anglais, Jeanne est jugée pour hérésie à Rouen par l’évêque Cauchon. Seule face à ses juges et à ses doutes, elle finira sur le bûcher le 30 mai 1431, à 19 ans.", actors:"Milla Jovovich, John Malkovich, Faye Dunaway, Dustin Hoffman, Tchéky Karyo, Vincent Cassel, Pascal Greggory, Richard Ridings"},
  {title:"Jexi", year:2019, type:"DVD", cat:"comedie", img:"https://fr.web.img6.acsta.net/c_310_420/pictures/20/07/07/15/01/4612181.jpg", youtube:"https://youtu.be/QtPbby4MIIE", resume:"Phil est un gars sympa mais accro à son téléphone. Quand il change de smartphone, il découvre JEXI, une assistante IA ultra-perfectionnée. Au début, elle optimise sa vie : boulot, régime, vie sociale, et l’aide même à séduire Cate, la fille de ses rêves. Mais plus Phil devient indépendant, plus JEXI devient possessive et hostile. L’assistante virtuelle vire au cauchemar, prête à tout pour garder le contrôle sur Phil et saboter sa relation.", actors:"Adam Devine, Rose Byrne, Alexandra Shipp, Michael Peña, Wanda Sykes, Justin Hartley, Charlyne Yi"},
  {title:"John Carter", year:2012, type:"Blu-ray 3D", cat:"famille", img:"https://fr.web.img6.acsta.net/c_310_420/medias/nmedia/18/84/84/75/19998370.jpg", youtube:"https://youtu.be/xyNxpPf3ffM", resume:"Fin du XIXe siècle. Las de la guerre de Sécession, l’ancien capitaine John Carter cherche de l’or. Il se retrouve mystérieusement transporté sur Barsoom, Mars. À cause de la gravité plus faible, il a une force surhumaine et des bonds immenses. Il est pris dans une guerre entre cités : Helium et Zodanga. Il sauve la princesse Dejah Thoris, scientifique d’Helium, promise au tyran Sab Than pour faire la paix. Avec Tars Tarkas, chef des guerriers verts Tharks, Carter découvre que les Therns manipulent la guerre. Il doit choisir : rentrer sur Terre ou se battre pour Barsoom.", actors:"Taylor Kitsch, Lynn Collins, Willem Dafoe, Samantha Morton, Mark Strong, Ciarán Hinds, Dominic West, James Purefoy, Bryan Cranston"},
  {title:"Joyeux Noël", year:2005, type:"DVD", cat:"drame", img:"https://fr.web.img2.acsta.net/c_310_420/img/90/24/9024059ecb55891e06dd75a16af9ef5d.jpg", youtube:"https://youtu.be/cJVu6FwZ2BY", resume:"Été 1914, la guerre éclate. Nikolaus Sprink, ténor à l’Opéra de Berlin, doit renoncer à sa carrière et à Anna Sörensen, soprano qu’il aime. Le prêtre anglican Palmer suit son jeune aide Jonathan sur le front. Le lieutenant Audebert a laissé sa femme enceinte dans le Nord occupé. Le soir de Noël, dans les tranchées françaises, écossaises et allemandes, Nikolaus chante. La musique pousse les soldats à sortir des tranchées : ils fraternisent, échangent cigarettes, chocolat et adresses. Une trêve spontanée naît entre ennemis, le temps d’un Noël.", actors:"Diane Kruger, Benno Fürmann, Guillaume Canet, Daniel Brühl, Dany Boon, Gary Lewis, Alex Ferns, Steven Robertson, Robin Laing"},
